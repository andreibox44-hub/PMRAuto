<style>
/* Layout: sticky marketplace header, filter bar over a card grid; detail = gallery + sticky price panel */
:root {
  --bg: #f2f4f7;
  --surface: #ffffff;
  --surface-2: #eceff4;
  --media: #e2e7ee;
  --stage: #0f131a;
  --text: #171c26;
  --muted: #5d6879;
  --border: #e0e4eb;
  --border-strong: #c3cad6;
  --primary: #e85d0c;
  --primary-hover: #cc4f06;
  --primary-soft: #fff2e9;
  --on-primary: #ffffff;
  --accent: #0b4fb3;
  --pmr-red: #c8102e;
  --pmr-green: #00843d;
  --logo-blue: #1a8fd0;
  --hero-tint: #e8f2fb;
  --photo-text: #ffffff;
  --photo-scrim: 8, 12, 18;
  --photo-ink: #141a24;
  --photo-ink-soft: #3b4556;
  --photo-light-bg: #f4f2ef;
  --danger: #c8281c;
  --danger-soft: #fef1f0;
  --danger-border: #f2c4bf;
  --overlay: rgba(12, 16, 24, .72);
  --best-bg: #e3f4ea; --best-fg: #0a6b34;
  --scrim: rgba(16, 24, 40, .55);
  --toast-bg: #171c26;
  --toast-fg: #ffffff;
  --focus: rgba(232, 93, 12, .35);
  --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .08);
  --shadow-lg: 0 12px 32px rgba(16, 24, 40, .16);

  --fuel-petrol-bg: #fff0e3; --fuel-petrol-fg: #a3410a;
  --fuel-diesel-bg: #e9edf3; --fuel-diesel-fg: #344054;
  --fuel-hybrid-bg: #e4f5ea; --fuel-hybrid-fg: #106b3e;
  --fuel-ev-bg: #e4eeff;     --fuel-ev-fg: #0b4fb3;
  --fuel-gas-bg: #f2eaff;    --fuel-gas-fg: #6338b8;

  --font: "Onest", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --radius: 12px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11141a; --surface: #1a1e26; --surface-2: #232833; --media: #2a303b; --stage: #0b0e13;
    --text: #e7eaf0; --muted: #9ba5b5; --border: #2c323e; --border-strong: #434b5a;
    --primary: #ff7a2b; --primary-hover: #ff9152; --primary-soft: #36231a; --on-primary: #1a0e06;
    --accent: #84b4ff; --pmr-red: #f0414f; --pmr-green: #2fb46b; --logo-blue: #5cc3f5; --hero-tint: #17212e; --danger: #ff6b5e; --danger-soft: #361c1a; --danger-border: #5e2b27;
    --overlay: rgba(0, 0, 0, .72); --best-bg: #143222; --best-fg: #74d9a0; --scrim: rgba(0, 0, 0, .66);
    --toast-bg: #e7eaf0; --toast-fg: #11141a; --focus: rgba(255, 122, 43, .4);
    --shadow: 0 1px 2px rgba(0, 0, 0, .3); --shadow-lg: 0 12px 32px rgba(0, 0, 0, .45);
    --fuel-petrol-bg: #3a2416; --fuel-petrol-fg: #ffb27d;
    --fuel-diesel-bg: #2a303b; --fuel-diesel-fg: #c9d1dd;
    --fuel-hybrid-bg: #173326; --fuel-hybrid-fg: #7fd9a6;
    --fuel-ev-bg: #172a47;     --fuel-ev-fg: #9cc3ff;
    --fuel-gas-bg: #2d2242;    --fuel-gas-fg: #c9b0ff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11141a; --surface: #1a1e26; --surface-2: #232833; --media: #2a303b; --stage: #0b0e13;
  --text: #e7eaf0; --muted: #9ba5b5; --border: #2c323e; --border-strong: #434b5a;
  --primary: #ff7a2b; --primary-hover: #ff9152; --primary-soft: #36231a; --on-primary: #1a0e06;
  --accent: #84b4ff; --pmr-red: #f0414f; --pmr-green: #2fb46b; --logo-blue: #5cc3f5; --hero-tint: #17212e; --danger: #ff6b5e; --danger-soft: #361c1a; --danger-border: #5e2b27;
  --overlay: rgba(0, 0, 0, .72); --best-bg: #143222; --best-fg: #74d9a0; --scrim: rgba(0, 0, 0, .66);
  --toast-bg: #e7eaf0; --toast-fg: #11141a; --focus: rgba(255, 122, 43, .4);
  --shadow: 0 1px 2px rgba(0, 0, 0, .3); --shadow-lg: 0 12px 32px rgba(0, 0, 0, .45);
  --fuel-petrol-bg: #3a2416; --fuel-petrol-fg: #ffb27d;
  --fuel-diesel-bg: #2a303b; --fuel-diesel-fg: #c9d1dd;
  --fuel-hybrid-bg: #173326; --fuel-hybrid-fg: #7fd9a6;
  --fuel-ev-bg: #172a47;     --fuel-ev-fg: #9cc3ff;
  --fuel-gas-bg: #2d2242;    --fuel-gas-fg: #c9b0ff;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  font-family: var(--font);
  font-size: 15px;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

img { max-width: 100%; display: block; }
a { color: var(--accent); }
h1, h2, h3 { line-height: 1.2; margin: 0; text-wrap: balance; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

.container {
  width: 100%; max-width: 1200px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main.container { flex: 1; padding-top: 24px; padding-bottom: 48px; }

/* ---------- Header ---------- */
.topbar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 50;
}
.topbar-inner { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 64px; flex-wrap: wrap; }
.logo { font-size: 1.5rem; font-weight: 800; letter-spacing: -.02em; color: var(--text); text-decoration: none; }
.logo span { color: var(--logo-blue); }
/* PMR в цветах флага Приднестровья: красная, зелёная и красная полосы */
.logo-pmr {
  font-weight: inherit;
  color: var(--pmr-red);
  background: linear-gradient(to bottom, var(--pmr-red) 0 41%, var(--pmr-green) 41% 61%, var(--pmr-red) 61% 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}

.nav { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.nav-link { color: var(--text); text-decoration: none; font-weight: 500; padding: 8px 10px; border-radius: 8px; }
.nav-link:hover, .nav-link.active { background: var(--surface-2); }
.user-chip { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: .9rem; padding: 0 4px; }
.user-chip b { color: var(--text); }

/* ---------- Buttons & forms ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border: 1px solid transparent; border-radius: 10px;
  padding: 10px 16px; font: inherit; font-weight: 600; font-size: .95rem;
  cursor: pointer; text-decoration: none; white-space: nowrap;
  transition: background .15s, border-color .15s, color .15s;
}
.btn:disabled { opacity: .6; cursor: not-allowed; }
.btn-primary { background: var(--primary); color: var(--on-primary); }
.btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
.btn-ghost { background: var(--surface); color: var(--text); border-color: var(--border); }
.btn-ghost:hover { border-color: var(--border-strong); }
.btn-danger { background: var(--surface); color: var(--danger); border-color: var(--danger-border); }
.btn-danger:hover { background: var(--danger-soft); }
.btn-sm { padding: 6px 12px; font-size: .85rem; }
.btn-block { width: 100%; }

.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field label, .field .label { font-size: .75rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.field .hint { font-size: .8rem; color: var(--muted); }
input, select, textarea {
  font: inherit; color: var(--text);
  background: var(--surface);
  border: 1px solid var(--border); border-radius: 10px;
  padding: 10px 12px; width: 100%; min-width: 0;
}
input:focus, select:focus, textarea:focus { outline: 2px solid var(--focus); border-color: var(--primary); }
textarea { resize: vertical; min-height: 120px; }
.range { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.form-error { color: var(--danger); font-size: .9rem; min-height: 1.2em; margin: 0; }

/* ---------- Hero & filters ---------- */
.hero { margin-bottom: 16px; }
.hero h1 { font-size: clamp(1.5rem, 4vw, 2.1rem); letter-spacing: -.02em; }
.hero p { color: var(--muted); margin: 6px 0 0; }

.filters {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 16px;
  display: grid;
  grid-template-columns: 2fr 1.2fr 1.6fr 1.2fr 1.3fr auto;
  gap: 12px;
  align-items: end;
}

.results-head { display: flex; justify-content: space-between; align-items: center; margin: 20px 0 12px; color: var(--muted); }

/* ---------- Grid & cards ---------- */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; }

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow);
  display: flex; flex-direction: column;
  min-width: 0;
  transition: transform .15s, box-shadow .15s;
}
.card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
.card-link { color: inherit; text-decoration: none; display: flex; flex-direction: column; flex: 1; }
.card-media { position: relative; aspect-ratio: 4 / 3; max-width: 100%; background: var(--media); }
.card-media img { width: 100%; height: 100%; object-fit: cover; }
.photo-count {
  position: absolute; right: 8px; bottom: 8px;
  background: var(--overlay); color: #fff;
  font-size: .75rem; font-weight: 600; padding: 3px 8px; border-radius: 999px;
}
.example-badge {
  position: absolute; left: 8px; top: 8px;
  background: var(--surface); color: var(--text);
  font-size: .72rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
  padding: 3px 8px; border-radius: 6px; box-shadow: var(--shadow);
}
.example-badge.static { position: static; display: inline-block; margin-bottom: 6px; background: var(--surface-2); box-shadow: none; }
.credit { margin: 0; font-size: .8rem; color: var(--muted); overflow-wrap: anywhere; }
.card-body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.card-title { font-size: 1.05rem; font-weight: 700; overflow-wrap: anywhere; }
.card-title small { display: block; font-size: .85rem; font-weight: 400; color: var(--muted); margin-top: 2px; }
.card-price, .detail-price { font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.card-price { font-size: 1.3rem; }
.meta { list-style: none; display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 0; margin: 0; color: var(--muted); font-size: .9rem; font-variant-numeric: tabular-nums; }
.card-actions { display: flex; gap: 8px; padding: 0 16px 16px; }
.card-actions .btn { flex: 1; }
.owner-actions { display: grid; gap: 8px; }

.chip { display: inline-block; font-size: .78rem; font-weight: 600; padding: 2px 10px; border-radius: 999px; background: var(--fuel-diesel-bg); color: var(--fuel-diesel-fg); }
.chip-petrol { background: var(--fuel-petrol-bg); color: var(--fuel-petrol-fg); }
.chip-hybrid { background: var(--fuel-hybrid-bg); color: var(--fuel-hybrid-fg); }
.chip-electric { background: var(--fuel-ev-bg); color: var(--fuel-ev-fg); }
.chip-gas { background: var(--fuel-gas-bg); color: var(--fuel-gas-fg); }

/* ---------- Language picker (globe) ---------- */
.lang-picker { position: relative; }
.lang-toggle {
  display: inline-flex; align-items: center; gap: 6px;
  height: 42px; padding: 0 11px;
  border: 1px solid var(--border); border-radius: 10px;
  background: var(--surface); color: var(--text); cursor: pointer;
  font: inherit; font-size: .8rem; font-weight: 700; letter-spacing: .04em;
  transition: border-color .15s, color .15s;
}
.lang-toggle:hover, .lang-toggle[aria-expanded="true"] { border-color: var(--border-strong); color: var(--accent); }
.lang-toggle svg { width: 19px; height: 19px; }
.lang-menu {
  position: absolute; top: calc(100% + 6px); right: 0; z-index: 60;
  min-width: 190px; padding: 6px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow-lg);
  display: flex; flex-direction: column; gap: 2px;
}
.lang-menu button {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  width: 100%; padding: 9px 10px; border: 0; border-radius: 8px;
  background: transparent; color: var(--text); cursor: pointer; text-align: left;
  font: inherit; font-size: .92rem;
}
.lang-menu button:hover, .lang-menu button:focus-visible { background: var(--surface-2); outline: none; }
.lang-menu button.active { font-weight: 700; }
.lang-code { font-size: .75rem; font-weight: 700; letter-spacing: .04em; color: var(--muted); }
.lang-menu button.active .lang-code { color: var(--primary); font-size: .95rem; }

.empty {
  grid-column: 1 / -1;
  text-align: center; color: var(--muted);
  background: var(--surface); border: 1px dashed var(--border-strong); border-radius: var(--radius);
  padding: 48px 16px;
}
.empty h3 { color: var(--text); margin-bottom: 6px; }

/* ---------- Detail ---------- */
.back { display: inline-block; margin-bottom: 14px; text-decoration: none; font-weight: 500; }
.detail { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.gallery { min-width: 0; }
.gallery-main { position: relative; background: var(--stage); border-radius: var(--radius); overflow: hidden; aspect-ratio: 4 / 3; max-width: 100%; }
.gallery-main img { width: 100%; height: 100%; object-fit: contain; }
.g-nav {
  position: absolute; top: 50%; transform: translateY(-50%);
  width: 42px; height: 42px; border-radius: 50%; border: 0;
  background: var(--surface); color: var(--text); opacity: .92;
  font-size: 1.4rem; cursor: pointer; box-shadow: var(--shadow);
}
.g-prev { left: 10px; }
.g-next { right: 10px; }
.g-counter { position: absolute; left: 10px; bottom: 10px; background: var(--overlay); color: #fff; font-size: .8rem; padding: 3px 10px; border-radius: 999px; font-variant-numeric: tabular-nums; }
.thumbs { display: flex; gap: 8px; margin-top: 10px; overflow-x: auto; padding-bottom: 4px; }
.thumb { flex: 0 0 auto; width: 84px; aspect-ratio: 4 / 3; padding: 0; border: 2px solid transparent; border-radius: 8px; overflow: hidden; cursor: pointer; background: var(--media); }
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.thumb.active { border-color: var(--primary); }

.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; min-width: 0; }
.detail-side { display: flex; flex-direction: column; gap: 14px; position: sticky; top: calc(84px + env(safe-area-inset-top, 0px)); }
.detail-side h1 { font-size: 1.5rem; overflow-wrap: anywhere; }
.detail-price { font-size: 2rem; }
.key-facts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.key-fact { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }
.key-fact span { display: block; font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.key-fact b { font-size: 1rem; font-variant-numeric: tabular-nums; }
.seller { color: var(--muted); font-size: .9rem; margin: 0; }
.seller b { color: var(--text); }

.phone-box { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--primary-soft); border-radius: 10px; padding: 10px 12px; flex-wrap: wrap; }
.phone-box span { display: block; font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.phone-box b { font-size: 1.1rem; user-select: all; font-variant-numeric: tabular-nums; }

.section { margin-top: 20px; }
.section h2 { font-size: 1.2rem; margin-bottom: 12px; }
.specs { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 0 24px; margin: 0; }
.specs div { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
.specs dt { color: var(--muted); }
.specs dd { margin: 0; font-weight: 600; text-align: right; overflow-wrap: anywhere; }
.description { white-space: pre-line; margin: 0; overflow-wrap: anywhere; max-width: 70ch; }

/* ---------- Sell form ---------- */
.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.page-head h1 { font-size: clamp(1.4rem, 4vw, 1.9rem); letter-spacing: -.02em; }
.page-head p { margin: 4px 0 0; color: var(--muted); }

.form-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.form-grid .span-2 { grid-column: span 2; }
.form-grid .span-all { grid-column: 1 / -1; }
.form-section-title { grid-column: 1 / -1; font-size: 1.05rem; margin-top: 8px; padding-top: 14px; border-top: 1px solid var(--border); }
.form-section-title:first-child { margin-top: 0; padding-top: 0; border-top: 0; }
.req { color: var(--primary); }

.dropzone {
  position: relative;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  border: 2px dashed var(--border-strong); border-radius: var(--radius);
  padding: 28px 16px; text-align: center; cursor: pointer;
  background: var(--surface-2); color: var(--muted);
  transition: border-color .15s, background .15s;
}
.dropzone:hover, .dropzone.drag { border-color: var(--primary); background: var(--primary-soft); }
.dropzone strong { color: var(--text); font-size: 1rem; }
.dropzone input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.dz-icon { font-size: 2rem; line-height: 1; }

.previews { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; margin-top: 12px; }
.preview { position: relative; aspect-ratio: 4 / 3; max-width: 100%; border-radius: 10px; overflow: hidden; border: 1px solid var(--border); background: var(--media); }
.preview img { width: 100%; height: 100%; object-fit: cover; cursor: pointer; }
.preview .remove {
  position: absolute; top: 6px; right: 6px; width: 28px; height: 28px; border-radius: 50%; border: 0;
  background: var(--overlay); color: #fff; font-size: 1rem; line-height: 1; cursor: pointer;
}
.preview .main-badge { position: absolute; left: 6px; bottom: 6px; background: var(--primary); color: var(--on-primary); font-size: .72rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
.preview.loading { display: grid; place-items: center; color: var(--muted); font-size: .85rem; }

.form-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; flex-wrap: wrap; }

.storage-info { font-size: .85rem; color: var(--muted); }
.storage-bar { height: 6px; width: 180px; max-width: 100%; background: var(--border); border-radius: 999px; overflow: hidden; margin-top: 4px; }
.storage-bar i { display: block; height: 100%; background: var(--primary); }

/* ---------- Modal ---------- */
.modal {
  position: fixed; inset: 0; z-index: 100; display: grid; place-items: center;
  padding: calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.modal-backdrop { position: absolute; inset: 0; background: var(--scrim); }
.modal-dialog {
  position: relative; width: 100%; max-width: 420px; max-height: calc(100vh - 32px); overflow: auto;
  background: var(--surface); border-radius: 16px; box-shadow: var(--shadow-lg); padding: 24px;
}
.modal-close { position: absolute; top: 10px; right: 10px; width: 36px; height: 36px; border: 0; background: transparent; font-size: 1.6rem; color: var(--muted); cursor: pointer; border-radius: 8px; }
.modal-close:hover { background: var(--surface-2); }
.modal-text { color: var(--muted); margin: 10px 0 0; }
.tabs { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface-2); border-radius: 10px; padding: 4px; margin: 16px 0 18px; }
.tab { border: 0; background: transparent; padding: 8px; border-radius: 8px; font: inherit; font-weight: 600; color: var(--muted); cursor: pointer; }
.tab.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
.auth-form { display: flex; flex-direction: column; gap: 14px; }
.auth-extra { margin: -4px 0 0; text-align: center; }
.other-input { margin-top: 6px; }

/* ---------- Toast ---------- */
.toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px);
  background: var(--toast-bg); color: var(--toast-fg); padding: 12px 18px; border-radius: 10px;
  box-shadow: var(--shadow-lg); opacity: 0; pointer-events: none;
  transition: opacity .2s, transform .2s; z-index: 200; max-width: calc(100% - 32px); text-align: center;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.error { background: var(--danger); color: #fff; }

/* ---------- Footer ---------- */
.footer { border-top: 1px solid var(--border); background: var(--surface); color: var(--muted); font-size: .9rem; }
.footer-main { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr) minmax(0, 1fr); gap: 32px; padding-top: 40px; padding-bottom: 28px; }
.footer-brand { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.footer-brand .logo { font-size: 1.35rem; align-self: flex-start; }
.footer-tagline { margin: 0; max-width: 38ch; }
.footer-col { min-width: 0; }
.footer-col h2 { font-size: .75rem; font-weight: 700; color: var(--text); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 12px; }
.footer-links { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
.footer-links a { color: var(--muted); text-decoration: none; }
.footer-links a:hover, .footer-links a.active { color: var(--text); text-decoration: underline; text-underline-offset: 3px; }
.footer-bottom { border-top: 1px solid var(--border); }
.footer-bottom-inner { display: flex; justify-content: space-between; align-items: center; gap: 6px 24px; flex-wrap: wrap; padding-top: 16px; padding-bottom: 16px; font-size: .82rem; }
.footer-bottom p { margin: 0; }

/* ---------- Home: search hero ---------- */

.vehicle-tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.vehicle-tab {
  position: relative;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  min-height: 88px; padding: 12px 8px;
  border: 1.5px solid var(--border); border-radius: 12px;
  background: var(--surface); color: var(--muted); cursor: pointer;
  font: inherit; font-size: .85rem; font-weight: 600; line-height: 1.25; text-align: center;
  transition: border-color .15s, background .15s, color .15s;
}
.vehicle-tab svg { width: 32px; height: 32px; flex: none; }
.vehicle-tab:hover { border-color: var(--border-strong); color: var(--text); }
.vehicle-tab.active, .vehicle-tab:has(input:checked) { border-color: var(--primary); background: var(--primary-soft); color: var(--text); }
.vehicle-tab.active svg, .vehicle-tab:has(input:checked) svg { color: var(--primary); }
.vehicle-tab:has(input:focus-visible) { outline: 2px solid var(--primary); outline-offset: 2px; }
.vehicle-tab input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

.quick-search { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; align-items: end; }
.btn-search { min-height: 44px; font-size: 1rem; font-variant-numeric: tabular-nums; }
select:disabled { opacity: .55; cursor: not-allowed; }

.link-btn { border: 0; background: none; padding: 4px; color: var(--accent); font: inherit; font-weight: 600; cursor: pointer; white-space: nowrap; }
.link-btn:hover { text-decoration: underline; text-underline-offset: 3px; }

/* ---------- Home: layout (search panel 25% + banner 75%) ---------- */
main.container.container-wide { max-width: 1680px; }
.home-layout {
  display: grid;
  grid-template-columns: minmax(280px, 25%) minmax(0, 1fr);
  gap: 24px;
  align-items: start;
}
.home-search {
  position: sticky;
  top: calc(80px + env(safe-area-inset-top, 0px));
  max-height: calc(100vh - 96px - env(safe-area-inset-top, 0px));
  overflow-y: auto;
  display: flex; flex-direction: column; gap: 12px;
  padding: 18px 18px 0;
}
.home-search-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.home-search-head h2 { font-size: 1.2rem; letter-spacing: -.01em; }
.home-search-sub { margin: -8px 0 0; color: var(--muted); font-size: .88rem; }
/* В узкой панели виды транспорта идут сеткой 2 × 2 */
.home-search .vehicle-tabs { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.home-search .vehicle-tab { min-height: 64px; padding: 8px 6px; gap: 4px; font-size: .78rem; }
.home-search .vehicle-tab svg { width: 24px; height: 24px; }
/* Поля в два столбца: широкие поля занимают обе колонки; город с пробегом и топливо с коробкой стоят парами */
.home-search .quick-search { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.home-search .quick-search > .field { grid-column: 1 / -1; }
.home-search .quick-search > .field:nth-last-of-type(-n+4) { grid-column: auto; }
/* Кнопка поиска прилипает к низу панели, поэтому видна даже на невысоком экране */
.home-search .btn-search {
  grid-column: 1 / -1; position: sticky; bottom: 0; z-index: 1;
  margin: 2px -18px 0; padding-block: 14px; border-radius: 0 0 var(--radius) var(--radius);
  box-shadow: 0 -8px 16px var(--surface);
}

.home-main { min-width: 0; }
.hero-banner {
  position: relative;
  display: flex; align-items: flex-end;
  min-height: calc(100vh - 112px - env(safe-area-inset-top, 0px));
  border-radius: 16px; overflow: hidden;
  background: var(--stage);
}
.hero-photo { position: absolute; inset: 0; width: 100%; height: 100%; max-width: none; object-fit: cover; object-position: 45% 50%; }
.hero-scrim {
  position: absolute; inset: 0;
  background:
    linear-gradient(to top, rgba(var(--photo-scrim), .82) 0%, rgba(var(--photo-scrim), .5) 38%, rgba(var(--photo-scrim), .12) 72%),
    linear-gradient(to right, rgba(var(--photo-scrim), .35) 0%, rgba(var(--photo-scrim), 0) 60%);
}
.hero-content { position: relative; padding: clamp(24px, 4vw, 56px); max-width: 760px; color: var(--photo-text); }
.hero-content h1 { font-size: clamp(2rem, 4.2vw, 3.6rem); line-height: 1.05; letter-spacing: -.03em; }
.hero-content p { margin: 14px 0 0; max-width: 48ch; font-size: clamp(1rem, 1.3vw, 1.2rem); opacity: .92; }
.hero-actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 26px; }
.btn-on-photo {
  color: var(--photo-text); border-color: rgba(255, 255, 255, .6);
  background: rgba(255, 255, 255, .12); backdrop-filter: blur(6px);
}
.btn-on-photo:hover { background: rgba(255, 255, 255, .24); }
/* Светлое фото: тёмный текст на светлой части кадра. Цвета фиксированные,
   потому что фото одинаковое в светлой и тёмной теме.
   На компьютере баннер почти квадратный, поэтому текст сверху над машинами */
.hero-light { align-items: flex-start; background: var(--photo-light-bg); }
.hero-light .hero-photo { object-position: 62% 100%; }
.hero-light .hero-scrim {
  background:
    linear-gradient(to bottom, rgba(255, 255, 255, .88) 0%, rgba(255, 255, 255, .55) 30%, rgba(255, 255, 255, 0) 48%),
    linear-gradient(to right, rgba(255, 255, 255, .6) 0%, rgba(255, 255, 255, 0) 40%);
}
.hero-light .hero-content { max-width: 680px; color: var(--photo-ink); }
.hero-light .hero-content h1 { font-size: clamp(2rem, 3.4vw, 3.2rem); }
.hero-light .hero-content p { opacity: 1; color: var(--photo-ink-soft); }
.hero-light .btn-on-photo { color: var(--photo-ink); border-color: rgba(20, 26, 36, .3); background: rgba(255, 255, 255, .7); }
.hero-light .btn-on-photo:hover { background: rgba(255, 255, 255, .95); }

.hero-credit {
  position: absolute; right: 12px; bottom: 10px;
  font-size: .7rem; color: var(--photo-text); opacity: .7; text-decoration: none;
}
.hero-credit:hover { opacity: 1; text-decoration: underline; }

.home-main .brand-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.home-main .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 1300px) {
  .home-main .brand-grid { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .home-main .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}

/* ---------- Home: sections ---------- */
.home-section { margin-top: 40px; }
.section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 14px; }
.section-head h2 { font-size: 1.35rem; letter-spacing: -.01em; }
.section-head a { font-weight: 600; text-decoration: none; white-space: nowrap; }
.section-head a:hover { text-decoration: underline; }

.brand-grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
.brand-tile {
  display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
  padding: 14px 16px; min-width: 0;
  border: 1px solid var(--border); border-radius: 12px;
  background: var(--surface); color: var(--text); cursor: pointer;
  font: inherit; text-align: left;
  transition: border-color .15s, transform .15s, box-shadow .15s;
}
.brand-tile:hover { border-color: var(--primary); transform: translateY(-1px); box-shadow: var(--shadow); }
.brand-name { font-weight: 800; font-size: 1.05rem; letter-spacing: -.01em; overflow-wrap: anywhere; }
.brand-count { font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; }

.btn-lg { padding: 14px 24px; font-size: 1rem; }

/* ---------- Search results ---------- */
.results-layout {
  display: grid;
  grid-template-columns: 290px minmax(0, 1fr);
  grid-template-areas: "side bar" "side list";
  grid-template-rows: auto 1fr; /* лишняя высота длинной панели уходит в список, а не в заголовок */
  column-gap: 24px;
  align-items: start;
}
.results-bar { grid-area: bar; display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.results-heading { min-width: 0; }
.results-heading h1 { font-size: clamp(1.4rem, 3.5vw, 1.8rem); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.results-crit { margin: 4px 0 0; color: var(--muted); }
.results-tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.results-tools select { width: auto; }
.sort-label { font-size: .85rem; color: var(--muted); }
.filters-toggle { display: none; }
.sidebar {
  grid-area: side;
  position: sticky; top: calc(84px + env(safe-area-inset-top, 0px));
  max-height: calc(100vh - 100px); overflow: auto;
  padding: 18px;
}
.sidebar-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.sidebar-head h2 { font-size: 1.05rem; }
.refine-form { display: flex; flex-direction: column; gap: 14px; }
.results-grid { grid-area: list; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); align-content: start; }
.empty-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 16px; }

/* ---------- Sell form: vehicle type ---------- */
.vehicle-field { border: 0; padding: 0; margin: 0; min-width: 0; }
.vehicle-field legend { padding: 0; margin-bottom: 6px; }
.field label.vehicle-tab { text-transform: none; letter-spacing: normal; font-size: .85rem; font-weight: 600; }

/* ---------- Account ---------- */
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.avatar {
  display: inline-grid; place-items: center; flex: none;
  border-radius: 50%; object-fit: cover; max-width: none;
  background: var(--primary-soft); color: var(--primary); font-weight: 800; letter-spacing: .02em;
}

.user-chip { text-decoration: none; padding: 4px 10px 4px 4px; border-radius: 999px; border: 1px solid transparent; }
.user-chip:hover, .user-chip.active { background: var(--surface-2); border-color: var(--border); }
.user-chip .user-label { max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.account { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 24px; align-items: start; }
.account-side { position: sticky; top: calc(84px + env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; gap: 16px; }
.account-id { display: flex; align-items: center; gap: 14px; min-width: 0; }
.account-id-text { min-width: 0; }
.account-id h1 { font-size: 1.2rem; overflow-wrap: anywhere; }
.account-id p, .account-since { margin: 2px 0 0; color: var(--muted); font-size: .88rem; }
.account-since { margin: -6px 0 0; }
.completeness { display: flex; flex-direction: column; gap: 6px; font-size: .85rem; font-weight: 600; }
.completeness-bar { width: 100%; }
.completeness p { margin: 0; font-weight: 400; color: var(--muted); font-size: .8rem; }
.account-tabs { display: flex; flex-direction: column; gap: 4px; border-top: 1px solid var(--border); padding-top: 12px; }
.account-tab {
  display: flex; justify-content: space-between; align-items: center; gap: 8px;
  padding: 10px 12px; border-radius: 10px;
  color: var(--text); text-decoration: none; font-weight: 600;
}
.account-tab:hover { background: var(--surface-2); }
.account-tab.active { background: var(--primary-soft); color: var(--text); box-shadow: inset 3px 0 0 var(--primary); }
.tab-count { min-width: 24px; padding: 1px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); font-size: .78rem; text-align: center; font-variant-numeric: tabular-nums; }
.account-tab.active .tab-count { background: var(--surface); }

.account-main { min-width: 0; display: flex; flex-direction: column; gap: 20px; }
.account-form-head { margin-bottom: 18px; }
.account-form-head h2, .account-title { font-size: 1.35rem; letter-spacing: -.01em; }
.account-form-head p { margin: 4px 0 0; color: var(--muted); }
.form-grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.form-grid > .hint { margin: -4px 0 0; font-size: .8rem; color: var(--muted); }
.avatar-edit { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.avatar-actions { display: flex; flex-direction: column; gap: 8px; }
.avatar-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
.avatar-actions .hint { font-size: .8rem; color: var(--muted); }
#p-avatar:focus-visible + .hint, .avatar-buttons label:focus-within { outline: 2px solid var(--primary); }
.account-grid { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
.danger-zone { border-color: var(--danger-border); }
.danger-zone h2 { font-size: 1.1rem; }
.danger-zone p { margin: 6px 0 14px; color: var(--muted); max-width: 60ch; }

/* ---------- Seller card on listing page ---------- */
.seller-card { display: flex; flex-direction: column; gap: 10px; padding-top: 14px; border-top: 1px solid var(--border); }
.seller-head { display: flex; align-items: center; gap: 12px; min-width: 0; }
.seller-head-text { display: flex; flex-direction: column; min-width: 0; }
.seller-label { font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.seller-name { font-size: 1.05rem; overflow-wrap: anywhere; }
.seller-meta, .seller-posted { font-size: .82rem; color: var(--muted); }
.seller-posted { margin: 0; }
.seller-contacts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.seller-contacts li { display: flex; justify-content: space-between; gap: 12px; font-size: .88rem; }
.seller-contacts span { color: var(--muted); }
.seller-contacts b { overflow-wrap: anywhere; text-align: right; user-select: all; }

@media (max-width: 1000px) {
  .account { grid-template-columns: minmax(0, 1fr); }
  .account-side { position: static; }
  .account-tabs { flex-direction: row; overflow-x: auto; scrollbar-width: none; }
  .account-tab { flex: none; }
  .account-tab.active { box-shadow: inset 0 -3px 0 var(--primary); }
}
@media (max-width: 600px) {
  .form-grid.two { grid-template-columns: minmax(0, 1fr); }
  .account-tabs { flex-wrap: wrap; overflow: visible; }
}

/* ---------- Сообщения ---------- */
.badge {
  display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 6px;
  border-radius: 999px; background: var(--danger); color: #fff;
  font-size: .72rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1;
}
.nav-messages { display: inline-flex; align-items: center; gap: 6px; }
.nav-messages svg { width: 20px; height: 20px; }
.tab-unread { background: var(--danger); color: #fff; }
.account-tab.active .tab-unread { background: var(--danger); }

.contact-seller { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
.contact-seller .btn svg { width: 20px; height: 20px; }
.contact-note { margin: 0; font-size: .85rem; color: var(--muted); text-align: center; }
.contact-own {
  display: flex; justify-content: space-between; align-items: center; gap: 8px 16px; flex-wrap: wrap;
  padding: 14px 16px; border-radius: var(--radius); background: var(--surface-2);
}
.contact-own span { font-weight: 600; }
.contact-own a { font-weight: 600; text-decoration: none; }

.messenger {
  display: grid; grid-template-columns: minmax(240px, 300px) minmax(0, 1fr);
  height: clamp(520px, calc(100vh - 150px), 820px);
  padding: 0; overflow: hidden;
}
.panel.messenger { padding: 0; }
.chat-list { border-right: 1px solid var(--border); overflow-y: auto; min-width: 0; }
.chat-list-head { font-size: 1.15rem; padding: 18px 18px 12px; position: sticky; top: 0; background: var(--surface); z-index: 1; }
.chat-list ul { list-style: none; margin: 0; padding: 0 8px 8px; display: flex; flex-direction: column; gap: 2px; }
.chat-item { display: flex; gap: 10px; padding: 10px; border-radius: 10px; color: var(--text); text-decoration: none; min-width: 0; }
.chat-item:hover { background: var(--surface-2); }
.chat-item.active { background: var(--primary-soft); }
.chat-thumb { width: 52px; height: 40px; border-radius: 8px; object-fit: cover; flex: none; background: var(--media); }
.chat-item-body { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
.chat-item-top, .chat-item-bottom { display: flex; justify-content: space-between; align-items: center; gap: 8px; min-width: 0; }
.chat-item-title { font-size: .92rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chat-item-top time { font-size: .75rem; color: var(--muted); flex: none; font-variant-numeric: tabular-nums; }
.chat-item-partner { font-size: .78rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chat-snippet { font-size: .85rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chat-item.unread .chat-snippet { color: var(--text); font-weight: 600; }
.chat-empty { padding: 8px 18px 18px; color: var(--muted); }
.chat-empty h3 { color: var(--text); font-size: 1rem; margin-bottom: 6px; }
.chat-empty p { margin: 0 0 12px; font-size: .9rem; }

.chat-thread { display: grid; grid-template-rows: auto minmax(0, 1fr) auto auto; min-width: 0; min-height: 0; }
.chat-placeholder { grid-row: 1 / -1; display: grid; place-content: center; justify-items: center; gap: 8px; color: var(--muted); padding: 24px; text-align: center; }
.chat-placeholder svg { width: 44px; height: 44px; opacity: .5; }
.chat-head { padding: 12px 16px; border-bottom: 1px solid var(--border); }
.chat-back { display: none; font-weight: 600; text-decoration: none; margin-bottom: 8px; }
.chat-head-main { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.chat-car { display: flex; align-items: center; gap: 10px; color: var(--text); text-decoration: none; min-width: 0; }
.chat-car:hover b { text-decoration: underline; }
.chat-car-text, .chat-partner-text { display: flex; flex-direction: column; min-width: 0; }
.chat-car-text span, .chat-partner-text span { font-size: .8rem; color: var(--muted); }
.chat-partner { display: flex; align-items: center; gap: 8px; }

.chat-messages { overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 6px; background: var(--bg); }

    'footer.storage': 'Объявления, профили и сообщения хранятся на сервере Supabase',

    'page.placeholder': 'Это текст-заглушка. Настоящее содержание страницы появится позже.',
    'page.about.title': 'О нас',
    'page.about.body': 'PMRAuto — площадка для покупки и продажи автомобилей в Приднестровье и Молдове. Частные продавцы размещают здесь объявления, а покупатели находят подходящую машину и договариваются с продавцом напрямую.\n\nКроме легковых машин, на PMRAuto можно продать или найти мотоцикл, грузовик или фургон. В каталоге удобно искать по марке, модели, году, цене, пробегу, городу, топливу и коробке передач.\n\nРазместить объявление просто: зарегистрируйтесь, заполните форму и добавьте до 10 фото. Покупатели напишут вам во встроенный чат, а объявление можно в любой момент снять.\n\nОбъявления с пометкой «Пример» созданы для демонстрации: модели, характеристики и фото настоящие, а продавцы и истории машин придуманы.\n\nЕсть вопрос или идея? Нажмите «Задать вопрос» — мы ответим.',
    'page.contacts.title': 'Контакты',
    'page.contacts.body': 'У PMRAuto нет офиса и телефона для звонков.\n\nЕсть вопрос, нашли ошибку или хотите предложить идею? Напишите нам через форму «Задать вопрос»: кнопка ниже или в правом нижнем углу любой страницы. Мы ответим на e-mail, который вы укажете.',
    'page.privacy.title': 'Политика конфиденциальности',
    'page.privacy.body': 'Здесь простыми словами рассказано, какие данные использует сайт PMRAuto и где они хранятся.\n\nАккаунт, профиль, объявления, фото и переписка хранятся на сервере сервиса Supabase:\n• для входа: e-mail и пароль. Пароль хранится только в виде хеша, мы его не видим;\n• профиль: логин, имя, город, контактный e-mail или Telegram, аватар;\n• телефон из профиля. Его видите только вы, он подставляется в новые объявления;\n• ваши объявления и фото;\n• переписка с продавцами и покупателями.\n\nЧто видят другие посетители: ваши объявления (с телефоном, если вы указали его в объявлении), а также логин, имя, город, аватар, контактный e-mail и Telegram из профиля. Переписку видят только её участники. E-mail для входа и пароль никому не показываются.\n\nВ вашем браузере хранятся только данные входа (чтобы не вводить пароль каждый раз), выбранный язык, избранное и список сравнения.\n\nФорма «Задать вопрос»: имя, e-mail и текст сообщения отправляются нам через сервис Web3Forms. Мы используем их только для ответа.\n\nШрифт сайта загружается с Google Fonts. При этом ваш браузер обращается к серверам Google, и Google видит ваш IP-адрес.\n\nCookies, реклама и счётчики посещений не используются.\n\nЧтобы удалить свои данные, откройте «Личный кабинет» → «Безопасность» → «Удалить аккаунт». Аккаунт, профиль, объявления с фото и переписка будут удалены с сервера.',
    'page.terms.title': 'Условия использования',
    'page.terms.body': 'Правила пользования сайтом PMRAuto.\n\nPMRAuto только показывает объявления и помогает покупателю связаться с продавцом. Сделки вы заключаете напрямую друг с другом: мы в них не участвуем и не проверяем машины и продавцов. Объявления с пометкой «Пример» созданы для демонстрации.\n\nПожалуйста:\n• размещайте только свои машины и правдивые данные;\n• не публикуйте чужие фото без разрешения;\n• не размещайте оскорбления, спам и незаконный контент.\n\nМы можем удалить объявления и аккаунты, которые нарушают эти правила.\n\nСайт предоставляется как есть, без гарантий. Перед покупкой проверяйте машину и документы сами.\n\nВопросы по правилам задавайте через форму «Задать вопрос».',
    'page.impressum.title': 'Impressum',
    'page.impressum.body': 'PMRAuto — демо-проект. Сайт работает в тестовом режиме и не ведёт коммерческой деятельности.\n\nImpressum — страница с данными владельца сайта. Она будет заполнена, когда PMRAuto начнёт работать как настоящая площадка.\n\nСвязаться с нами можно через форму «Задать вопрос».',
    'page.cookies.title': 'Настройки cookies',
    'page.cookies.body': 'Сайт не использует cookies, рекламу и счётчики посещений.\n\nВ хранилище вашего браузера (localStorage) сохраняется только то, что нужно для работы сайта:\n• данные входа в аккаунт — чтобы не вводить пароль при каждом посещении;\n• выбранный язык;\n• избранное и список сравнения;\n• время отправки последнего вопроса через форму — для защиты от спама.\n\nАккаунт, объявления, фото и переписка хранятся на сервере Supabase. Подробнее — в политике конфиденциальности.\n\nЧтобы убрать эти данные из браузера, выйдите из аккаунта или очистите данные этого сайта в настройках браузера. Аккаунт и объявления на сервере при этом останутся.',

    'page.placeholder': 'This is placeholder text. The real content will be added later.',
    'page.about.title': 'About us',
    'page.about.body': 'PMRAuto is a marketplace for buying and selling cars in Transnistria and Moldova. Private sellers post listings here, and buyers find the right car and deal with the seller directly.\n\nBesides cars, you can sell or find a motorcycle, truck or van on PMRAuto. The catalogue lets you search by make, model, year, price, mileage, city, fuel type and gearbox.\n\nPosting a listing is easy: sign up, fill in the form and add up to 10 photos. Buyers can message you in the built-in chat, and you can remove your listing at any time.\n\nListings marked “Example” were made for demonstration: the models, specs and photos are real, but the sellers and the cars’ histories are made up.\n\nHave a question or an idea? Click “Ask a question” and we’ll get back to you.',
    'page.contacts.title': 'Contact',
    'page.contacts.body': 'PMRAuto has no office or phone line.\n\nHave a question, found a bug or want to suggest an idea? Write to us using the “Ask a question” form: the button below or in the bottom-right corner of any page. We’ll reply to the email you enter.',
    'page.privacy.title': 'Privacy policy',
    'page.privacy.body': 'This page explains in plain words what data PMRAuto uses and where it is stored.\n\nYour account, profile, listings, photos and messages are stored on a server run by the Supabase service:\n• for signing in: your email and password. The password is stored only as a hash, so we can’t see it;\n• your profile: username, name, city, contact email or Telegram, avatar;\n• the phone number in your profile. Only you can see it; it’s filled in on your new listings;\n• your listings and photos;\n• your messages with sellers and buyers.\n\nWhat other visitors can see: your listings (with the phone number, if you added it to the listing), plus the username, name, city, avatar, contact email and Telegram from your profile. Messages are visible only to the people in the conversation. Your sign-in email and password are never shown to anyone.\n\nYour browser stores only your sign-in session (so you don’t have to enter your password every time), your chosen language, your favourites and your comparison list.\n\nThe “Ask a question” form: your name, email and message are sent to us through the Web3Forms service. We use them only to reply.\n\nThe site’s font is loaded from Google Fonts. To do this your browser connects to Google’s servers, so Google sees your IP address.\n\nThe site uses no cookies, ads or visitor tracking.\n\nTo delete your data, open “My account” → “Security” → “Delete account”. Your account, profile, listings with photos and messages will be deleted from the server.',
    'page.terms.title': 'Terms of use',
    'page.terms.body': 'The rules for using PMRAuto.\n\nPMRAuto only shows listings and helps buyers contact sellers. You make deals directly with each other: we take no part in them and don’t check the vehicles or the sellers. Listings marked “Example” were made for demonstration.\n\nPlease:\n• list only your own vehicles and give accurate details;\n• don’t post other people’s photos without permission;\n• don’t post insults, spam or illegal content.\n\nWe may remove listings and accounts that break these rules.\n\nThe site is provided as is, without any guarantees. Check the vehicle and its documents yourself before you buy.\n\nIf you have questions about these rules, use the “Ask a question” form.',
    'page.impressum.title': 'Impressum',
    'page.impressum.body': 'PMRAuto is a demo project. The site is running in test mode and is not a commercial service.\n\nThe Impressum is the legal notice naming who runs the site. It will be completed once PMRAuto launches as a real marketplace.\n\nYou can contact us using the “Ask a question” form.',
    'page.cookies.title': 'Cookie settings',
    'page.cookies.body': 'The site uses no cookies, ads or visitor tracking.\n\nYour browser’s storage (localStorage) keeps only what the site needs to work:\n• your sign-in session, so you don’t have to enter your password on every visit;\n• your chosen language;\n• your favourites and comparison list;\n• when you last sent a question through the form, to protect against spam.\n\nYour account, listings, photos and messages are stored on a Supabase server. See the privacy policy for details.\n\nTo remove this data from your browser, log out or clear this site’s data in your browser settings. Your account and listings on the server will stay.',

/* ---------- Данные: Supabase ----------
   Объявления и профили загружаются с сервера один раз и лежат в памяти (db),
   поэтому страницы рисуются сразу. Изменения уходят на сервер и тут же
   попадают в db. Раз в 30 секунд при переходах данные обновляются.
   Внутри сайта пользователи называются логинами: owner, buyer, seller — это логины,
   а id из базы нужны только для запросов. */

// Ссылка из письма «восстановить пароль» открывает сайт с #...type=recovery — запоминаем до разбора адреса
const RECOVERY_LINK = /type=recovery/.test(location.hash);
const AUTH_LINK_ERROR = /error_code=/.test(location.hash);
// Ссылку с ошибкой (устарела, уже использована) убираем до запуска Supabase:
// увидев ошибку в адресе, он выходит из аккаунта, а нам достаточно показать сообщение
if (AUTH_LINK_ERROR) {
  try { history.replaceState(null, '', '#/'); } catch { /* ignore */ }
}

const sb = window.supabase?.createClient(SUPABASE_URL, SUPABASE_KEY) || null;

const db = {
  listings: [],        // объявления из базы
  users: new Map(),    // логин → { id, username, createdAt, profile }
  byId: new Map(),     // id пользователя → логин
  me: null,            // кто вошёл: { id, username, email, phone }
  loadedAt: 0,
  failed: false,
};

const PROFILE_COLS = 'id, username, name, city, email, telegram, avatar, created_at';
const ts = (iso) => (iso ? Date.parse(iso) : 0);
const nameOf = (id) => db.byId.get(id) || '';

// Ответ Supabase → данные или исключение
function must({ data, error }) {
  if (error) throw error;
  return data;
}

function rememberProfile(row) {
  const user = {
    id: row.id,
    username: row.username,
    createdAt: ts(row.created_at),
    profile: { name: row.name, city: row.city, email: row.email, telegram: row.telegram, avatar: row.avatar },
  };
  db.users.set(row.username, user);
  db.byId.set(row.id, row.username);
  return user;
}

// Профили, которых ещё нет в памяти (например, собеседник зарегистрировался недавно)
async function ensureProfiles(ids) {
  const missing = [...new Set(ids)].filter((id) => id && !db.byId.has(id));
  if (!missing.length || !sb) return;
  const { data } = await sb.from('profiles').select(PROFILE_COLS).in('id', missing);
  (data || []).forEach(rememberProfile);
}

function listingFromRow(r) {
  return {
    id: r.id,
    owner: nameOf(r.owner),
    ownerId: r.owner,
    createdAt: ts(r.created_at),
    vehicle: r.vehicle,
    brand: r.brand,
    model: r.model,
    year: r.year,
    mileage: r.mileage,
    price: r.price,
    fuel: r.fuel,
    transmission: r.transmission,
    power: r.power ?? '',
    body: r.body,
    color: r.color,
    city: r.city,
    phone: r.phone,
    description: r.description,
    photos: r.photos || [],
  };
}

async function loadData() {
  if (!sb) {
    db.failed = true;
    return;
  }
  try {
    const [profiles, listings] = await Promise.all([
      sb.from('profiles').select(PROFILE_COLS),
      sb.from('listings').select('*').order('created_at', { ascending: false }).limit(1000),
    ]);
    const profileRows = must(profiles);
    const listingRows = must(listings);
    db.users.clear();
    db.byId.clear();
    profileRows.forEach(rememberProfile);
    db.listings = listingRows.map(listingFromRow);
    db.failed = false;
  } catch (err) {
    console.warn('Supabase: не удалось загрузить данные', err);
    db.failed = true;
  }
  db.loadedAt = Date.now();
}

// Кто вошёл. Телефон из профиля личный — он хранится в данных пользователя, а не в общей таблице
async function loadSession(session) {
  const u = session?.user;
  if (!u) {
    db.me = null;
    return;
  }
  await ensureProfiles([u.id]);
  const username = nameOf(u.id);
  db.me = username ? { id: u.id, username, email: u.email, phone: u.user_metadata?.phone || '' } : null;
}

let refreshing = null;
const dataSignature = () => JSON.stringify(db.listings) + JSON.stringify([...db.users.values()]);
// Обновляет данные, если они старше 30 секунд. Возвращает true, если что-то изменилось
async function refreshData(force = false) {
  if (!force && Date.now() - db.loadedAt < 30000) return false;
  if (!refreshing) {
    const before = dataSignature();
    refreshing = loadData().then(() => dataSignature() !== before).finally(() => { refreshing = null; });
  }
  return refreshing;
}

function newId() {
  if (crypto.randomUUID) return crypto.randomUUID();
  const b = crypto.getRandomValues(new Uint8Array(16));
  b[6] = (b[6] & 0x0f) | 0x40;
  b[8] = (b[8] & 0x3f) | 0x80;
  const h = [...b].map((x) => x.toString(16).padStart(2, '0')).join('');
  return `${h.slice(0, 8)}-${h.slice(8, 12)}-${h.slice(12, 16)}-${h.slice(16, 20)}-${h.slice(20)}`;
}

/* ---------- Фото в Supabase Storage ----------
   Файлы лежат в папке photos/<id пользователя>/..., загружать можно только в свою папку. */

function dataUrlToBlob(dataUrl) {
  const [head, body] = dataUrl.split(',');
  const type = head.match(/data:([^;]+)/)?.[1] || 'image/jpeg';
  const bytes = atob(body);
  const arr = new Uint8Array(bytes.length);
  for (let i = 0; i < bytes.length; i++) arr[i] = bytes.charCodeAt(i);
  return new Blob([arr], { type });
}

async function uploadPhoto(path, dataUrl) {
  must(await sb.storage.from(PHOTO_BUCKET).upload(path, dataUrlToBlob(dataUrl), {
    contentType: 'image/jpeg',
    // Час в кэше: дольше нельзя, иначе удалённое фото ещё долго будет открываться по старой ссылке
    cacheControl: '3600',
  }));
  return sb.storage.from(PHOTO_BUCKET).getPublicUrl(path).data.publicUrl;
}

// Путь в хранилище по публичной ссылке; для чужих ссылок (img/..., data:) — null
function photoPath(url) {
  const marker = `/storage/v1/object/public/${PHOTO_BUCKET}/`;
  const i = String(url || '').indexOf(marker);
  return i < 0 ? null : decodeURIComponent(url.slice(i + marker.length));
}

// Удаление файлов — «по возможности»: если не вышло, остаётся лишний файл, но сайт работает
async function removePhotos(urls) {
  const paths = urls.map(photoPath).filter(Boolean);
  if (!paths.length || !sb) return;
  try {
    const removed = must(await sb.storage.from(PHOTO_BUCKET).remove(paths));
    if (removed.length < paths.length) console.warn('Supabase: удалены не все фото', paths, removed);
  } catch (err) {
    console.warn('Supabase: не удалось удалить фото', err);
  }
}

/* ---------- Аутентификация (Supabase Auth) ----------
   Вход по e-mail и паролю; пароли хранит и проверяет сервер.
   Логин (username) — имя пользователя на сайте, задаётся при регистрации.
   Функции возвращают ключ перевода ошибки или null. */

const siteUrl = () => location.origin + location.pathname;

// Ошибка Supabase → ключ перевода
function authError(err) {
  const code = err?.code || '';
  const msg = String(err?.message || '');
  if (err?.name === 'AuthRetryableFetchError' || err?.status === 0 || /fetch|network/i.test(msg)) return 'err.network';
  if (code === 'invalid_credentials' || /invalid login credentials/i.test(msg)) return 'err.badLogin';
  if (code === 'email_not_confirmed' || /not confirmed/i.test(msg)) return 'err.notConfirmed';
  if (code === 'user_already_exists' || code === 'email_exists' || /already (been )?registered/i.test(msg)) return 'err.emailTaken';
  if (code === 'weak_password') return 'err.passwordWeak';
  if (code === 'same_password') return 'err.samePassword';
  if (code === 'email_address_invalid' || code === 'validation_failed') return 'err.email';
  if (code.startsWith('over_') || err?.status === 429) return 'err.rateLimit';
  if (/database error saving new user/i.test(msg)) return 'err.taken'; // логин успели занять одновременно
  console.warn('Supabase auth:', err);
  return 'err.server';
}

async function register(username, email, password, password2) {
  username = username.trim();
  email = email.trim();
  if (!/^[a-zA-Z0-9_.-]{3,20}$/.test(username)) return 'err.username';
  if (!EMAIL_RE.test(email)) return 'err.email';
  if (password.length < 6) return 'err.passwordShort';
  if (password !== password2) return 'err.passwordMismatch';
  if (!sb) return 'err.network';
  try {
    if (must(await sb.rpc('username_taken', { name: username }))) return 'err.taken';
  } catch (err) {
    return authError(err);
  }
  const { data, error } = await sb.auth.signUp({
    email,
    password,
    options: { data: { username }, emailRedirectTo: siteUrl() },
  });
  if (error) return authError(error);
  // При включённом подтверждении почты Supabase не сообщает, что адрес занят, а отдаёт пустой список identities
  if (data.user && !data.user.identities?.length) return 'err.emailTaken';
  if (!data.session) return 'auth.checkEmail'; // нужно подтвердить почту — это не ошибка, форма покажет подсказку
  await loadSession(data.session);
  return currentUser() ? null : 'err.server';
}

async function login(email, password) {
  if (!EMAIL_RE.test(email.trim())) return 'err.email';
  if (!sb) return 'err.network';
  const { data, error } = await sb.auth.signInWithPassword({ email: email.trim(), password });
  if (error) return authError(error);
  await loadSession(data.session);
  return currentUser() ? null : 'err.server';
}

async function logout() {
  try {
    await sb?.auth.signOut();
  } catch { /* сессия всё равно будет удалена из браузера */ }
  db.me = null;
  subscribeMessages();
  toast(t('auth.loggedOut'));
  if (['sell', 'my', 'account'].includes(currentRoute.name)) go('home');
  else router();
}

// Вход/выход в другой вкладке (Supabase сообщает об этом сам) и обновление сессии
function onAuthChange(event, session) {
  // Вызывать Supabase прямо внутри этого обработчика нельзя — откладываем
  setTimeout(async () => {
    if (event === 'PASSWORD_RECOVERY') return openNewPassword();
    const before = currentUser();
    if (event === 'SIGNED_OUT') db.me = null;
    else if (session?.user?.id !== db.me?.id) await loadSession(session);
    if (currentUser() === before || !booted) return;
    subscribeMessages();
    if (!currentUser() && ['sell', 'my', 'account'].includes(currentRoute.name)) go('home');
    else if (currentRoute.name !== 'sell') router({ keepScroll: true });
    else renderNav('sell');
  }, 0);
}
if (sb) sb.auth.onAuthStateChange(onAuthChange);

function langSwitchHtml() {

        aria-checked="${l === lang}" class="${l === lang ? 'active' : ''}">

      </button>`).join('')}

function toggleLangMenu(open) {
  const menu = $('#lang-menu');
  const toggle = $('#lang-toggle');
  if (!menu) return;
  const show = open ?? menu.hidden;
  menu.hidden = !show;
  toggle.setAttribute('aria-expanded', String(show));
  if (show) menu.querySelector('[aria-checked="true"]')?.focus();
}

// Закрываем меню языков по клику мимо него и по Esc; стрелками ходим по пунктам
document.addEventListener('click', (e) => {
  if (!e.target.closest('#lang-picker')) toggleLangMenu(false);
});
document.addEventListener('keydown', (e) => {
  const menu = $('#lang-menu');
  if (!menu || menu.hidden) return;
  if (e.key === 'Escape') {
    toggleLangMenu(false);
    $('#lang-toggle').focus();
    return;
  }
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    const items = [...menu.querySelectorAll('[data-lang]')];
    const i = items.indexOf(document.activeElement);
    items[(i + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length].focus();
  }
});

// Сравниваем названия без регистра, без разницы между «ё» и «е» и без румынских знаков:
// «Chisinau», «Chișinău» и «кишинев» — один город. Знаки снимаются только с латинских букв,
// поэтому русская «й» не превращается в «и»
const normCity = (s) => String(s).trim().toLowerCase().replace(/ё/g, 'е')
  .normalize('NFD').replace(/([a-z])[̀-ͯ]+/g, '$1').normalize('NFC');

const CITY_INDEX = new Map(ALL_CITIES.flatMap((c) => [c.ru, c.en, ...(c.alt || [])].map((n) => [normCity(n), c])));
const findCity = (name) => CITY_INDEX.get(normCity(name));

// незнакомые города остаются как их написал продавец
function cityKey(car) {
  const names = (car.city && typeof car.city === 'object' ? Object.values(car.city) : [car.city])
    .filter(Boolean).map((c) => String(c).trim());
  for (const name of names) {
    const known = findCity(name);
    if (known) return known.ru;
  }
  return names[0] || '';
}

}

/* ---------- Марки и модели: списки и сопоставление ---------- */

// Значение пункта «Другая» в списках марок и моделей: при нём появляется поле для ручного ввода
const OTHER = '__other';

// Сравнение названий моделей без регистра, пробелов, дефисов и точек: «CX-5» = «cx5», «ID.3» = «ID3»
const normModel = (s) => String(s || '').toLowerCase().replace(/[\s\-.]/g, '');
const sameBrand = (a, b) => normBrand(brandKey(a)) === normBrand(brandKey(b));

// Модели марки из справочника (для одного вида транспорта или для всех)
const catalogModels = (brand, vehicle) => [...new Set((vehicle ? [vehicle] : VEHICLES).flatMap((v) => MODELS[v]?.[brand] || []))];

/* Модель объявления → модель из справочника, или null, если такой там нет.
   «Golf 1.5 eTSI» → Golf, «Range Rover Sport HSE» → Range Rover Sport (самое длинное совпадение),
   «320d Touring» → BMW 3 Series, «C 200 4MATIC» → Mercedes-Benz C-Class. */
function resolveModel(brand, model, vehicle = '') {
  const list = catalogModels(brand, vehicle);
  const m = normModel(model);
  if (!m || !list.length) return null;
  let best = null;
  for (const c of list) {
    const n = normModel(c);
    if (n && m.startsWith(n) && (!best || n.length > normModel(best).length)) best = c;
  }
  if (best) return best;
  const text = String(model).trim();
  if (brand === 'BMW') {
    const d = text.match(/^([1-8])\d{2}/); // 320d → 3 Series
    if (d && list.includes(`${d[1]} Series`)) return `${d[1]} Series`;
  }
  if (brand === 'Mercedes-Benz' || brand === 'Maybach') {
    const l = text.match(/^([A-Z]{1,3})\s?\d/); // C 200 → C-Class, ML 350 → M-Class
    if (l) {
      const name = l[1] === 'ML' ? 'M' : l[1];
      return [`${name}-Class`, name].find((c) => list.includes(c)) || null;
    }
  }
  return null;
}
const modelOf = (car) => resolveModel(brandKey(car.brand), car.model, vehicleOf(car));

// Марки для поиска: из справочника и из объявлений (если продавец ввёл свою марку)
function brandsFor(vehicle) {
  const known = vehicle ? BRANDS_BY_VEHICLE[vehicle] : Object.values(BRANDS_BY_VEHICLE).flat();
  const listed = getListings().filter((l) => !vehicle || vehicleOf(l) === vehicle).map((l) => brandKey(l.brand));
  return [...new Set([...known, ...listed])].sort(byName);
}

// Модели марки: из справочника и свои модели из объявлений, которых в справочнике нет
function modelsFor(vehicle, brand) {
  if (!brand) return [];
  const known = catalogModels(brand, vehicle);
  const listed = getListings()
    .filter((l) => sameBrand(l.brand, brand) && (!vehicle || vehicleOf(l) === vehicle) && !modelOf(l))
    .map((l) => l.model.trim());
  return [...new Set([...known, ...listed])].sort(byName);
}

const isCatalogBrand = (brand) => Object.values(BRANDS_BY_VEHICLE).some((list) => list.includes(brand));

// После смены вида транспорта или марки убираем значения из справочника, которых больше нет в списках.
// Свои марку и модель (введённые через «Другая») оставляем
function normalizeFilters() {
  if (filters.brand && isCatalogBrand(filters.brand) && !brandsFor(filters.vehicle).includes(filters.brand)) {
    filters.brand = '';
    filters.model = '';
  }
  const brandModels = filters.brand ? catalogModels(filters.brand, '') : [];
  if (filters.model && brandModels.includes(filters.model) && !modelsFor(filters.vehicle, filters.brand).includes(filters.model)) {
    filters.model = '';
  }
}

/* Выпадающий список марок: сначала «Популярные марки» (по алфавиту), потом «Все марки»,
   в конце «Другая». selected — значение, которое нужно выбрать (марка, OTHER или '') */
function brandSelectOptions(vehicle, selected, placeholder, brands = brandsFor(vehicle)) {
  const popular = (POPULAR_BRANDS[vehicle || 'car'] || []).filter((b) => brands.includes(b)).sort(byName);
  let marked = false; // марка есть в обеих группах — отмечаем выбранной только первую
  const opt = (b) => {
    const on = !marked && b === selected;
    if (on) marked = true;
    return `<option value="${esc(b)}"${on ? ' selected' : ''}>${esc(brandLabel(b))}</option>`;
  };
  const groups = popular.length
    ? `<optgroup label="${esc(t('brands.popular'))}">${popular.map(opt).join('')}</optgroup>
       <optgroup label="${esc(t('brands.all'))}">${brands.map(opt).join('')}</optgroup>`
    : brands.map(opt).join('');
  return `<option value="">${esc(placeholder)}</option>${groups}`
    + `<option value="${OTHER}"${selected === OTHER ? ' selected' : ''}>${esc(t('form.other'))}</option>`;
}

// Выпадающий список моделей (уже по алфавиту) с «Другая» в конце
function modelSelectOptions(models, selected, placeholder) {
  return selectOptions(models, selected, placeholder)
    + `<option value="${OTHER}"${selected === OTHER ? ' selected' : ''}>${esc(t('form.other'))}</option>`;
}

/* В поиске «Другая» хранится прямо в фильтре: своя марка — это filters.brand, которой нет в списке.
   Пока поле ещё пустое, помним, что «Другая» выбрана, в searchOther */
const searchOther = { brand: false, model: false };

function resetFilters(extra = {}) {
  Object.assign(filters, DEFAULT_FILTERS, extra);
  searchOther.brand = false;
  searchOther.model = false;
}

// Что выбрать в списке: значение из списка, «Другая» (своё значение или пустое поле) или ничего
function searchSelected(kind, list) {
  const value = filters[kind];
  if (value) return list.includes(value) ? value : OTHER;
  return searchOther[kind] ? OTHER : '';
}

const brandOptions = () => {
  const brands = brandsFor(filters.vehicle);
  return brandSelectOptions(filters.vehicle, searchSelected('brand', brands), t('filters.allBrands'), brands);
};
const modelOptions = () => {
  const models = modelsFor(filters.vehicle, filters.brand);
  return modelSelectOptions(models, searchSelected('model', models),
    filters.brand ? t('search.anyModel') : t('search.chooseBrandFirst'));
};
const brandOtherShown = () => searchSelected('brand', brandsFor(filters.vehicle)) === OTHER;
const modelOtherShown = () => !!filters.brand && searchSelected('model', modelsFor(filters.vehicle, filters.brand)) === OTHER;
const ownValue = (kind, list) => (filters[kind] && !list.includes(filters[kind]) ? filters[kind] : '');

function matches(car, f = filters) {
  const n = (v) => (v === '' ? null : Number(v));
  const words = f.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const title = `${car.brand} ${car.model}`.toLowerCase();
  return (!f.vehicle || vehicleOf(car) === f.vehicle)
    && (!f.brand || sameBrand(car.brand, f.brand))
    // Модель из справочника или своя: «C 200 4MATIC» найдётся по C-Class, «Golf 1.5» — по Golf
    && (!f.model || modelOf(car) === f.model || normModel(car.model).startsWith(normModel(f.model)))
    && (n(f.yearFrom) === null || car.year >= n(f.yearFrom))
    && (n(f.yearTo) === null || car.year <= n(f.yearTo))
    && (n(f.priceFrom) === null || car.price >= n(f.priceFrom))
    && (n(f.priceTo) === null || car.price <= n(f.priceTo))
    && (!f.city || cityKey(car) === f.city)
    && (n(f.kmTo) === null || car.mileage <= n(f.kmTo))
    && (!f.fuel || code(car.fuel) === f.fuel)
    && (!f.transmission || code(car.transmission) === f.transmission)
    && words.every((w) => title.includes(w));
}

const searchResults = () => getListings().filter((c) => matches(c)).sort(SORTERS[filters.sort] || SORTERS.new);
const activeFilterCount = () => COUNTED_FILTERS.filter((k) => filters[k] !== '').length;

/* Любое изменение поля сразу попадает в filters; марка и модель пересобираются под вид транспорта и марку.
   «Другая» в списке марки или модели показывает поле для ручного ввода (brandText / modelText) */
function bindSearchForm(form, onUpdate) {
  const el = form.elements;
  const syncModel = () => {
    el.model.innerHTML = modelOptions();
    el.model.disabled = !filters.brand;
    el.modelText.hidden = !modelOtherShown();
    if (el.modelText.hidden) el.modelText.value = '';
  };
  const syncBrand = () => {
    el.brand.innerHTML = brandOptions();
    el.brandText.hidden = !brandOtherShown();
    if (el.brandText.hidden) el.brandText.value = '';
    syncModel();
  };
  const handle = (e) => {
    const { name, value } = e.target;
    if (name === 'brand' || name === 'model') {
      const other = value === OTHER;
      const next = other ? '' : value;
      if (searchOther[name] === other && filters[name] === next) return;
      searchOther[name] = other;
      filters[name] = next;
      if (name === 'brand') {
        filters.model = '';
        searchOther.model = false;
        syncBrand();
      } else syncModel();
      if (other) (name === 'brand' ? el.brandText : el.modelText).focus();
    } else if (name === 'brandText' || name === 'modelText') {
      const kind = name === 'brandText' ? 'brand' : 'model';
      const text = value.trim();
      if (filters[kind] === text) return;
      filters[kind] = text;
      if (kind === 'brand') {
        // Своя марка: список моделей — только свои модели из объявлений этой марки
        filters.model = '';
        searchOther.model = false;
        syncModel();
      }
    } else {
      if (!(name in filters) || filters[name] === value) return;
      filters[name] = value;
      if (name === 'vehicle') {
        normalizeFilters();
        syncBrand();
      }
    }
    onUpdate();
  };
  form.addEventListener('input', handle);
  form.addEventListener('change', handle);
}

function rawSaved(kind) {

}

function toggleSaved(kind, id) {
  const ids = savedListings(kind).map((l) => l.id);
  const on = !ids.includes(id);
  if (on && kind === 'cmp' && ids.length >= COMPARE_MAX) {
    toast(t('cmp.full', { max: COMPARE_MAX }), 'error');
    return;
  }
  try {
    store.set(SAVED_KEYS[kind], on ? [...ids, id] : ids.filter((x) => x !== id));
  } catch {
    toast(t('err.storage'), 'error');
    return;
  }
  if (kind === 'fav') toast(t(on ? 'fav.added' : 'fav.removed'));
  else toast(on ? t('cmp.added', { n: ids.length + 1, max: COMPARE_MAX }) : t('cmp.removed'));
  // На страницах «Избранное» и «Сравнение» перерисовываем список, на остальных — только кнопки
  if (['favorites', 'compare'].includes(currentRoute.name)) router({ keepScroll: true });
  else updateSavedUI();
}

const toggleLabel = (kind, on) => t(`${kind}.${on ? 'remove' : 'add'}`);

// Круглые кнопки поверх фото в карточке
function cardToolsHtml(id) {
  return ['fav', 'cmp'].map((kind) => {
    const on = isSaved(kind, id);
    return `<button type="button" class="icon-toggle ${kind}-toggle" data-save="${kind}" data-id="${esc(id)}"
      aria-pressed="${on}" aria-label="${toggleLabel(kind, on)}" title="${toggleLabel(kind, on)}">${kind === 'fav' ? HEART_ICON : COMPARE_ICON}</button>`;
  }).join('');
}

// Кнопки с подписью на странице объявления
function saveActionsHtml(id) {
  return `<div class="save-actions">${['fav', 'cmp'].map((kind) => {
    const on = isSaved(kind, id);
    return `<button type="button" class="btn btn-ghost btn-sm save-btn${on ? ' on' : ''}" data-save="${kind}" data-id="${esc(id)}">
      ${kind === 'fav' ? HEART_ICON : COMPARE_ICON}<span>${t(`${kind}.${on ? 'btnActive' : 'btn'}`)}</span></button>`;
  }).join('')}</div>`;
}

function savedNavHtml(route) {
  return ['fav', 'cmp'].map((kind) => {
    const name = kind === 'fav' ? 'favorites' : 'compare';
    return `<a href="#" data-go="${name}" id="nav-${kind}" class="nav-link nav-icon${route === name ? ' active' : ''}"${kind === 'cmp' ? ' hidden' : ''}>
      ${kind === 'fav' ? HEART_ICON : COMPARE_ICON}<span class="nav-icon-label">${t(`nav.${name}`)}</span><span class="count" hidden></span></a>`;
  }).join('');
}

// Счётчики в шапке. «Сравнение» показываем, только когда в нём что-то есть
function updateSavedNav() {
  ['fav', 'cmp'].forEach((kind) => {
    const link = $(`#nav-${kind}`);
    if (!link) return;
    const n = savedListings(kind).length;
    const label = t(`nav.${kind === 'fav' ? 'favorites' : 'compare'}`);
    const badge = link.querySelector('.count');
    badge.textContent = n;
    badge.hidden = !n;
    link.setAttribute('aria-label', n ? `${label}: ${n}` : label);
    if (kind === 'cmp') link.hidden = !n && currentRoute.name !== 'compare';
  });
}

function updateSavedUI() {
  document.querySelectorAll('.icon-toggle[data-save]').forEach((b) => {
    const on = isSaved(b.dataset.save, b.dataset.id);
    b.setAttribute('aria-pressed', on);
    b.setAttribute('aria-label', toggleLabel(b.dataset.save, on));
    b.title = toggleLabel(b.dataset.save, on);
  });
  document.querySelectorAll('.save-btn[data-save]').forEach((b) => {
    const on = isSaved(b.dataset.save, b.dataset.id);
    b.classList.toggle('on', on);
    b.querySelector('span').textContent = t(`${b.dataset.save}.${on ? 'btnActive' : 'btn'}`);
  });
  updateSavedNav();
}

document.addEventListener('click', (e) => {
  const btn = e.target.closest('[data-save]');
  if (btn) toggleSaved(btn.dataset.save, btn.dataset.id);
});

const savedEmptyHtml = (kind) => `<div class="empty"><h3>${t(`${kind}.empty`)}</h3><p>${t(`${kind}.emptyText`)}</p>

}

// Строки таблицы: [подпись, значение для показа, число для поиска лучшего, что лучше]
const COMPARE_ROWS = [
  ['cmp.price', (c) => fmtPrice(c.price), (c) => Number(c.price), 'min'],
  ['spec.year', (c) => c.year, (c) => Number(c.year), 'max'],
  ['spec.mileage', (c) => fmtKm(c.mileage), (c) => Number(c.mileage), 'min'],
  ['spec.power', (c) => (c.power ? `${c.power} ${t('unit.hp')}` : ''), (c) => Number(c.power) || null, 'max'],
  ['spec.vehicle', (c) => t(`vehicle.${vehicleOf(c)}`)],
  ['spec.fuel', (c) => tv('fuel', c.fuel)],
  ['spec.transmission', (c) => tv('transmission', c.transmission)],
  ['spec.body', (c) => tv('body', c.body)],
  ['spec.color', (c) => loc(c.color)],
  ['spec.city', (c) => cityLabel(cityKey(c))],
];

// Лучшее значение подсвечиваем, только если значения у объявлений различаются
function bestValue(cars, getNum, better) {
  const nums = cars.map(getNum).filter((n) => n != null && Number.isFinite(n));
  if (cars.length < 2 || new Set(nums).size < 2) return null;
  return better === 'min' ? Math.min(...nums) : Math.max(...nums);
}

function viewCompare() {
  const cars = savedListings('cmp');
  const head = `
    <div class="page-head">
      <div><h1>${t('cmp.title')}</h1><p>${t('cmp.note', { max: COMPARE_MAX })}</p></div>
      ${cars.length ? `<button type="button" class="btn btn-ghost btn-sm" id="cmp-clear">${t('cmp.clear')}</button>` : ''}
    </div>`;
  if (!cars.length) {
    app.innerHTML = head + savedEmptyHtml('cmp');
    return;
  }
  const rows = COMPARE_ROWS.map(([label, show, getNum, better]) => {
    const best = getNum ? bestValue(cars, getNum, better) : null;
    return `<tr><th scope="row">${t(label)}</th>${cars.map((c) => {
      const isBest = best != null && getNum(c) === best;
      return `<td${isBest ? ' class="best"' : ''}>${esc(show(c) || '—')}</td>`;
    }).join('')}</tr>`;
  }).join('');
  app.innerHTML = `${head}
    <div class="compare-scroll">
      <table class="compare" style="--cols: ${cars.length}">
        <thead><tr><th scope="col"><span class="visually-hidden">${t('cmp.param')}</span></th>${cars.map((c) => `
          <th scope="col">
            <a href="#" class="compare-car" data-go="car" data-param="${esc(c.id)}">
              <img src="${c.photos?.length ? photoSrc(c.photos[0]) : NO_PHOTO}" alt="" loading="lazy">
              <span>${esc(c.brand)} ${esc(c.model)}</span>
            </a>
            <button type="button" class="btn btn-ghost btn-sm cmp-remove" data-save="cmp" data-id="${esc(c.id)}">${t('cmp.removeOne')}</button>
          </th>`).join('')}
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    ${cars.length === 1 ? `<p class="compare-hint">${t('cmp.addMore')}</p>` : ''}`;
  $('#cmp-clear').addEventListener('click', () => {
    try { store.set(KEYS.compare, []); } catch { /* хранилище недоступно */ }
    toast(t('cmp.removed'));
    router({ keepScroll: true });
  });
}

  refetchedIds.add(id);
