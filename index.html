/* ---------- Сообщения: слой данных (Supabase) ----------
   Остальной код работает с чатами только через chatApi. Кто пишет, сервер берёт из сессии,
   а правила доступа в базе не дают читать и писать в чужие диалоги.
   Параметры user оставлены для совместимости — сервер их не использует.
   Чат: { id, listingId, buyer, seller, listing: { brand, model, price }, createdAt }
   Сообщение: { id, chatId, from, text, createdAt } (buyer, seller, from — логины) */

const chatFromRow = (r) => ({
  id: r.id,
  listingId: r.listing_id,
  buyer: nameOf(r.buyer),
  seller: nameOf(r.seller),
  listing: r.listing || {},
  createdAt: ts(r.created_at),
});

const messageFromRow = (m) => ({ id: m.id, chatId: m.chat_id, from: nameOf(m.sender), text: m.text, createdAt: ts(m.created_at) });

// id сообщений, отправленных из этой вкладки: их не нужно перерисовывать, когда они придут через Realtime
const sentHere = new Set();

const chatApi = {
  // Диалоги текущего пользователя с последним сообщением и числом непрочитанных
  async listChats() {
    if (!db.me) return [];
    const rows = must(await sb.rpc('my_chats'));
    await ensureProfiles(rows.flatMap((r) => [r.buyer, r.seller, r.last_sender]));
    return rows.map((r) => ({
      ...chatFromRow(r),
      lastMessage: r.last_at ? { from: nameOf(r.last_sender), text: r.last_text, createdAt: ts(r.last_at) } : null,
      unread: r.unread,
    }));
  },

  // Один чат на пару «покупатель + объявление»: если он уже есть — возвращаем его
  async openChat(listing) {
    if (!db.me || listing.ownerId === db.me.id) throw new Error('own-listing');
    const find = async () => must(await sb.from('chats').select('*')
      .eq('listing_id', listing.id).eq('buyer', db.me.id).maybeSingle());
    const existing = await find();
    if (existing) return chatFromRow(existing);
    const { data, error } = await sb.from('chats').insert({
      listing_id: listing.id,
      seller: listing.ownerId,
      // Название и цена на момент начала диалога — чтобы чат читался, даже если объявление снимут
      listing: { brand: listing.brand, model: listing.model, price: listing.price },
    }).select().single();
    if (error?.code === '23505') return chatFromRow(await find()); // чат успели создать в другой вкладке
    if (error) throw error;
    return chatFromRow(data);
  },

  async getMessages(chatId) {
    const rows = must(await sb.from('messages').select('*').eq('chat_id', chatId).order('created_at'));
    return rows.map(messageFromRow);
  },

  async sendMessage(chatId, from, text) {
    const row = must(await sb.from('messages').insert({ chat_id: chatId, text }).select().single());
    sentHere.add(row.id);
    await chatApi.markRead(chatId);
    return messageFromRow(row);
  },

  async markRead(chatId) {
    if (db.me) await sb.rpc('mark_chat_read', { chat: chatId });
  },

  async unreadTotal() {
    if (!db.me) return 0;
    try {
      return must(await sb.rpc('my_chats')).reduce((n, r) => n + r.unread, 0);
    } catch {
      return 0;
    }
  },
};

// Новые сообщения приходят сразу (Supabase Realtime). База присылает только сообщения из своих диалогов
let messagesChannel = null;
function subscribeMessages() {
  if (messagesChannel) {
    sb.removeChannel(messagesChannel);
    messagesChannel = null;
  }
  if (!sb || !db.me) return;
  messagesChannel = sb.channel(`messages-${db.me.id}`)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, (payload) => {
      if (sentHere.delete(payload.new.id)) return;
      onMessagesChanged();
    })
    .subscribe();
}

// Перерисовывает счётчики и открытый диалог, сохраняя недописанный текст
async function onMessagesChanged() {
  refreshUnread();
  if (currentRoute.name !== 'account' || !String(currentRoute.param || '').startsWith('messages')) return;
  const input = $('#chat-input');
  const draft = input?.value || '';
  const hadFocus = input && document.activeElement === input;
  await renderMessagesTab(currentUser(), String(currentRoute.param).slice('messages:'.length) || null);
  const fresh = $('#chat-input');
  if (fresh) {
    fresh.value = draft;
    if (hadFocus) fresh.focus();
  }
}

const fmtTime = (ts) => new Date(ts).toLocaleTimeString(LOCALES[lang], { hour: '2-digit', minute: '2-digit' });
const sameDay = (a, b) => new Date(a).toDateString() === new Date(b).toDateString();

function fmtDay(ts) {
  const now = Date.now();
  if (sameDay(ts, now)) return t('chat.today');
  if (sameDay(ts, now - 86400000)) return t('chat.yesterday');
  const thisYear = new Date(ts).getFullYear() === new Date().getFullYear();
  return new Date(ts).toLocaleDateString(LOCALES[lang], { day: 'numeric', month: 'long', ...(thisYear ? {} : { year: 'numeric' }) });
}

const fmtListTime = (ts) => (sameDay(ts, Date.now())
  ? fmtTime(ts)
  : new Date(ts).toLocaleDateString(LOCALES[lang], { day: 'numeric', month: 'short' }));

const chatListing = (chat) => getListings().find((l) => l.id === chat.listingId) || null;

// Счётчик непрочитанных: в шапке сайта и на вкладке «Сообщения» в кабинете
async function refreshUnread() {
  const user = currentUser();
  if (!user) return;
  const n = await chatApi.unreadTotal(user);
  document.querySelectorAll('[data-unread]').forEach((el) => {
    el.textContent = n > 99 ? '99+' : String(n);
    el.hidden = n === 0;
  });
  $('#nav-messages')?.setAttribute('aria-label', n ? `${t('nav.messages')}. ${t('chat.unreadLabel', { n })}` : t('nav.messages'));
}

// «Написать продавцу»: незалогиненных — на вход, потом сразу в чат
async function startChat(listingId) {
  const listing = getListings().find((l) => l.id === listingId);
  if (!listing) return;
  const user = currentUser();
  if (!user) {
    openAuth('login', 'chat.loginToWrite');
    afterLogin = () => startChat(listingId);
    return;
  }
  if (listing.owner === user) return toast(t('chat.cantSelf'), 'error');
  try {
    const chat = await chatApi.openChat(listing, user);
    go('account', `messages:${chat.id}`);
  } catch {
    toast(t('chat.sendFailed'), 'error');
  }
}

function messagesHtml(messages, user) {

  for (const m of messages) {
    if (!prevDay || !sameDay(prevDay, m.createdAt)) html += `<div class="chat-day"><span>${fmtDay(m.createdAt)}</span></div>`;
    prevDay = m.createdAt;
    html += `<div class="msg ${m.from === user ? 'mine' : 'theirs'}">
      <p>${esc(m.text)}</p>
      <time datetime="${new Date(m.createdAt).toISOString()}">${fmtTime(m.createdAt)}</time>

  }
  return html;

async function renderThread(chat, user) {

  // После прочтения убираем значок непрочитанных у этого диалога в списке

  const listing = chatListing(chat);

          : `<div class="chat-car">${carInner}</div>`}
        <div class="chat-partner">
          ${avatarHtml(partner, 34)}
          <span class="chat-partner-text"><b>${esc(partnerName(partner))}</b><span>${partnerRole(chat, user)}</span></span>
        </div>
      </div>
    </header>
    <div class="chat-messages" id="chat-messages" role="log" aria-live="polite">${messagesHtml(messages, user)}</div>
    <form class="chat-compose" id="chat-compose">
      <label for="chat-input" class="visually-hidden">${t('chat.placeholder')}</label>
      <textarea id="chat-input" name="text" rows="1" maxlength="2000" placeholder="${esc(t('chat.placeholder'))}"></textarea>
      <button type="submit" class="btn btn-primary chat-send" aria-label="${t('chat.send')}">${SEND_ICON}<span class="send-label">${t('chat.send')}</span></button>
    </form>
    <p class="chat-hint">${t('chat.hint')}</p>`;

  const list = $('#chat-messages');
  list.scrollTop = list.scrollHeight;
  const input = $('#chat-input');
  const autosize = () => {
    input.style.height = 'auto';
    input.style.height = `${Math.min(input.scrollHeight, 140)}px`;
  };
  input.addEventListener('input', autosize);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      $('#chat-compose').requestSubmit();
    }
  });
  $('#chat-compose').addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    const sendBtn = e.target.querySelector('.chat-send');
    if (!text || sendBtn.disabled) return input.focus();
    sendBtn.disabled = true; // от двойной отправки, пока ждём сервер
    try {
      await chatApi.sendMessage(chat.id, user, text);
    } catch {
      sendBtn.disabled = false;
      return toast(t('chat.sendFailed'), 'error');
    }
    await renderMessagesTab(user, chat.id);
    $('#chat-input')?.focus();
  });
  if (window.matchMedia('(min-width: 1001px)').matches) input.focus();
}

// Фото профиля обрезаем до квадрата 256×256 — около 20 КБ
function squareAvatar(dataUrl, size = 256) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const side = Math.min(img.naturalWidth, img.naturalHeight);
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, size, size);
      ctx.drawImage(img, (img.naturalWidth - side) / 2, (img.naturalHeight - side) / 2, side, side, 0, 0, size, size);
      resolve(canvas.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = () => reject(new Error('decode'));
    img.src = dataUrl;
  });
}

}

  const refreshKeepingDraft = () => {
    const draft = Object.fromEntries(new FormData($('#profile-form')));
    renderNav('account');

  $('#p-avatar').addEventListener('change', async (e) => {

    if (!file.type.startsWith('image/')) return toast(t('photos.skipped'), 'error');
    let dataUrl;
    try {
      dataUrl = await squareAvatar(await readFileAsDataURL(file));
    } catch {
      return toast(t('photos.unreadable', { name: file.name }), 'error');
    }
    const old = profileOf(user).avatar;
    try {
      // Новое имя файла при каждой замене — иначе браузер покажет старое фото из кэша
      const avatar = await uploadPhoto(`${db.me.id}/avatar-${Date.now().toString(36)}.jpg`, dataUrl);
      await saveProfile({ avatar });
    } catch (err) {
      return toast(t(authError(err)), 'error');
    }
    if (old) removePhotos([old]);
    refreshKeepingDraft();
    toast(t('profile.photoSaved'));
  });

  $('#p-avatar-remove')?.addEventListener('click', async () => {
    const old = profileOf(user).avatar;
    try {
      await saveProfile({ avatar: '' });
    } catch (err) {
      return toast(t(authError(err)), 'error');
    }
    removePhotos([old]);
    refreshKeepingDraft();
    toast(t('profile.photoRemoved'));
  });

  $('#profile-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(e.target));
    const val = (k) => (data[k] || '').trim();
    const email = val('email');
    const telegram = val('telegram').replace(/^@/, '');
    const showError = (key) => { $('#profile-error').textContent = t(key); };
    if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return showError('profile.badEmail');
    if (telegram && !/^[A-Za-z0-9_]{5,32}$/.test(telegram)) return showError('profile.badTelegram');
    const btn = e.target.querySelector('button[type=submit]');
    btn.disabled = true;
    try {
      await saveProfile({ name: val('name'), city: val('city'), email, telegram });
      await savePhone(val('phone'));
    } catch (err) {
      btn.disabled = false;
      return showError(authError(err));
    }
    renderNav('account');
    viewAccount('profile');
    toast(t('profile.saved'));
  });
}

function renderSecurityTab(user) {
  $('#account-main').innerHTML = `

        </div>
        <div class="field">
          <label for="pw-new">${t('security.new')}</label>
          <input id="pw-new" name="next" type="password" autocomplete="new-password">
        </div>
        <div class="field">
          <label for="pw-repeat">${t('auth.password2')}</label>

        </div>

      <h2>${t('security.deleteTitle')}</h2>
      <p>${t('security.deleteText')}</p>
      <button type="button" class="btn btn-danger" id="delete-account">${t('security.deleteBtn')}</button>
    </section>`;

  $('#password-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const { current = '', next = '', repeat = '' } = Object.fromEntries(new FormData(e.target));
    const showError = (key) => { $('#password-error').textContent = t(key); };
    if (next.length < 6) return showError('err.passwordShort');
    if (next !== repeat) return showError('err.passwordMismatch');
    const btn = e.target.querySelector('button[type=submit]');
    btn.disabled = true;
    try {
      // Сначала проверяем текущий пароль: повторный вход с ним
      const check = await sb.auth.signInWithPassword({ email: db.me.email, password: current });
      if (check.error) {
        const key = authError(check.error);
        return showError(key === 'err.badLogin' ? 'security.wrongCurrent' : key);
      }
      const { error } = await sb.auth.updateUser({ password: next });
      if (error) return showError(authError(error));

    go('home');

}

    if (!car || car.owner !== currentUser()) {

/* Марка и модель в форме: выпадающие списки из справочника и «Другая» с полем для ввода.
   Ставит в форму марку и модель (например, при редактировании или смене вида транспорта) */
function setSellBrandModel(vehicle, brand = '', model = '') {
  const known = BRANDS_BY_VEHICLE[vehicle] || BRANDS_BY_VEHICLE.car;
  const key = brandKey(brand);
  const selected = !brand ? '' : known.includes(key) ? key : OTHER;
  $('#s-brand').innerHTML = brandSelectOptions(vehicle, selected, t('sell.chooseBrand'), known);
  $('#s-brand-other').value = selected === OTHER ? brand : '';
  $('#s-brand-other').hidden = selected !== OTHER;
  updateSellModels(model);
}

// Пересобирает список моделей под выбранную марку. Пока марка не выбрана — список неактивен
function updateSellModels(model = '') {
  const vehicle = $('#sell-form').elements.vehicle.value || 'car';
  const brand = $('#s-brand').value;
  const models = brand && brand !== OTHER ? catalogModels(brand, vehicle).sort(byName) : [];
  // Модель из списка выбираем, только если она совпадает целиком: «C 200 4MATIC» останется своей,
  // чтобы при редактировании не потерять подробности. У своей марки списка нет — сразу поле ввода
  const exact = models.find((m) => normModel(m) === normModel(model));
  const selected = !brand ? '' : exact || (model || brand === OTHER ? OTHER : '');
  const select = $('#s-model');
  select.innerHTML = modelSelectOptions(models, selected, brand ? t('sell.chooseModel') : t('search.chooseBrandFirst'));
  select.disabled = !brand;
  $('#s-model-other').hidden = selected !== OTHER;
  $('#s-model-other').value = selected === OTHER && !exact ? model : '';
}

// Марка и модель, выбранные в форме (или введённые вручную через «Другая»)
function readSellBrandModel() {
  const f = $('#sell-form')?.elements;
  if (!f) return { brand: '', model: '' };
  const pick = (select, input) => (select.value === OTHER ? input.value.trim() : select.value);
  return { brand: pick(f.brandSelect, f.brandOther), model: f.modelSelect.disabled ? '' : pick(f.modelSelect, f.modelOther) };
}

function readFileAsDataURL(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result); // строка вида data:image/...;base64,....
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(file);
  });
}

/* Уменьшаем картинку через canvas и снова получаем base64 (JPEG):
   фото с телефона весят по 5–10 МБ, а после уменьшения — около 200 КБ. */
function downscaleImage(dataUrl, maxSide = 1280, quality = 0.8) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(img.naturalWidth * scale);
      canvas.height = Math.round(img.naturalHeight * scale);
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#fff'; // фон для PNG с прозрачностью
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = () => reject(new Error('decode'));
    img.src = dataUrl;
  });
}

async function addPhotos(fileList) {
  const files = [...fileList];
  const images = files.filter((f) => f.type.startsWith('image/'));
  if (images.length < files.length) toast(t('photos.skipped'), 'error');

  for (const file of images) {
    if (pendingPhotos.length + processingCount >= MAX_PHOTOS) {
      toast(t('photos.max', { max: MAX_PHOTOS }), 'error');
      break;
    }
    if (file.size > MAX_FILE_MB * 1024 * 1024) {
      toast(t('photos.tooBig', { name: file.name, max: MAX_FILE_MB }), 'error');
      continue;
    }
    processingCount++;
    renderPreviews();
    try {
      const base64 = await readFileAsDataURL(file);
      pendingPhotos.push(await downscaleImage(base64));
    } catch {
      toast(t('photos.unreadable', { name: file.name }), 'error');
    } finally {
      processingCount--;
      if ($('#previews')) renderPreviews();
    }
  }
}

function renderPreviews() {
  const box = $('#previews');
  if (!box) return;
  box.innerHTML = pendingPhotos.map((src, i) => `
    <div class="preview">
      <img src="${src}" alt="${t('detail.photoN', { n: i + 1 })}" data-cover="${i}" title="${t('photos.makeCover')}">
      ${i === 0 ? `<span class="main-badge">${t('photos.cover')}</span>` : ''}
      <button type="button" class="remove" data-remove="${i}" aria-label="${t('photos.remove')}">×</button>
    </div>`).join('')
    + Array.from({ length: processingCount }, () => `<div class="preview loading">${t('photos.loading')}</div>`).join('');
}

let publishing = false;

async function onSellSubmit(e) {
  e.preventDefault();
  const form = e.target;
  const errorEl = $('#sell-error');
  const data = Object.fromEntries(new FormData(form));
  const trimmed = (k) => (data[k] || '').trim();

  if (publishing) return;
  if (processingCount > 0) {
    errorEl.textContent = t('sell.processing');
    return;
  }
  const errors = [];
  const { brand, model } = readSellBrandModel();
  if (!brand) errors.push(t('field.brand'));
  if (!model) errors.push(t('field.model'));
  const year = Number(data.year);
  if (!Number.isInteger(year) || year < 1950 || year > CURRENT_YEAR + 1) errors.push(t('field.year', { range: `1950–${CURRENT_YEAR + 1}` }));
  const mileage = Number(data.mileage);
  if (data.mileage === '' || !Number.isFinite(mileage) || mileage < 0) errors.push(t('field.mileage'));
  const price = Number(data.price);
  if (!Number.isFinite(price) || price <= 0) errors.push(t('field.price'));
  if (!VEHICLES.includes(data.vehicle)) errors.push(t('field.vehicle'));
  if (!FUELS.includes(data.fuel)) errors.push(t('field.fuel'));

  if (errors.length) {
    errorEl.textContent = t('sell.check', { fields: errors.join(', ') });
    return;
  }

  if (!db.me) return requireLogin();
  const editing = editingId ? db.listings.find((l) => l.id === editingId) : null;
  const id = editing ? editing.id : newId();
  const row = {
    brand: brandKey(brand),
    model,
    year,
    mileage: Math.round(mileage),
    price: Math.round(price),
    vehicle: data.vehicle,
    fuel: data.fuel,
    transmission: data.transmission || '',
    power: data.power ? Math.round(Number(data.power)) : null,
    body: data.body || '',
    color: trimmed('color'),
    city: trimmed('city'),
    phone: trimmed('phone'),
    description: trimmed('description'),
  };

  // Сначала загружаем новые фото в Storage, потом сохраняем объявление со ссылками на них.
  // Уже загруженные фото (при редактировании) остаются как есть
  const submitBtn = $('#sell-submit');
  const status = (text) => { if (submitBtn) submitBtn.textContent = text; };
  const isNew = (src) => src.startsWith('data:');
  const total = pendingPhotos.filter(isNew).length;
  const photos = [];
  const uploaded = [];
  const batch = Date.now().toString(36); // своё имя у каждой загрузки, чтобы не задеть старые файлы
  publishing = true;
  submitBtn.disabled = true;
  errorEl.textContent = '';
  try {
    for (const [i, src] of pendingPhotos.entries()) {
      if (!isNew(src)) {
        photos.push(src);
        continue;
      }
      status(t('sell.uploading', { n: uploaded.length + 1, total }));
      const url = await uploadPhoto(`${db.me.id}/${id}/${batch}-${i + 1}.jpg`, src);
      uploaded.push(url);
      photos.push(url);
    }
    status(t('sell.publishing'));
    if (editing) {
      const saved = listingFromRow(must(await sb.from('listings').update({ ...row, photos }).eq('id', id).select().single()));
      db.listings = db.listings.map((l) => (l.id === id ? saved : l));
      removePhotos(editing.photos.filter((p) => !photos.includes(p))); // фото, которые убрали из объявления
    } else {
      const saved = must(await sb.from('listings').insert({ ...row, id, photos }).select().single());
      db.listings.unshift(listingFromRow(saved));
    }
  } catch (err) {
    removePhotos(uploaded);
    errorEl.textContent = `${t('sell.saveFailed')} ${t(authError(err))}`;
    status(t(editing ? 'sell.save' : 'sell.submit'));
    if (submitBtn) submitBtn.disabled = false;
    return;
  } finally {
    publishing = false;
  }
  pendingPhotos = [];
  editingId = null;
  toast(t(editing ? 'sell.saved' : 'sell.published'));
  if (editing) go('car', id, { replace: true }); // «Назад» не вернёт в уже сохранённую форму
  else go('car', id);
}

  openModal();

  $('#auth-form').addEventListener('submit', async (e) => {

    if (btn.disabled) return;
    const { username = '', email = '', password = '', password2 = '' } = Object.fromEntries(new FormData(e.target));
    btn.disabled = true;
    const error = isLogin ? await login(email, password) : await register(username, email, password, password2);
    btn.disabled = false;
    if (error === 'auth.checkEmail') {
      // Подтверждение почты включено в Supabase: показываем подсказку вместо ошибки
      $('#modal-body').innerHTML = `
        <h2 id="modal-title">${t('auth.registerTitle')}</h2>

      $('#auth-error').textContent = t(error);
      return;

    const target = afterLogin;
    closeModal();
    subscribeMessages();
    toast(t(isLogin ? 'auth.welcomeBack' : 'auth.welcomeNew', { name: displayName(currentUser()) }));
    if (typeof target === 'function') {
      router();
      target();
    } else if (target && target !== currentRoute.name) go(target);
    else router();
  });
}

    </form>`;
  openModal();

function openNewPassword() {
  if ($('#newpass-form') && !$('#modal').hidden) return;
  $('#modal-body').innerHTML = `
    <h2 id="modal-title">${t('auth.newPasswordTitle')}</h2>
    <p class="modal-text">${t('auth.newPasswordText')}</p>
    <form class="auth-form" id="newpass-form" novalidate>
      <div class="field">

/* ---------- Форма «Задать вопрос» (отправка через Web3Forms) ---------- */

const HELP_TOPICS = ['question', 'problem', 'idea'];
const HELP_MIN_FILL_MS = 3000;   // быстрее человек форму не заполнит — так отсекаем ботов
const HELP_COOLDOWN_SEC = 60;    // не больше одного сообщения в минуту из одного браузера
const HELP_MAX_LINKS = 2;        // спам обычно состоит из ссылок
const HELP_KEY_PLACEHOLDER = 'ВСТАВЬТЕ_КЛЮЧ_СЮДА';
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
let helpOpenedAt = 0;

function openHelp() {
  const user = currentUser();
  const p = user ? profileOf(user) : {};
  $('#modal-body').innerHTML = `

      <div class="field">
        <label for="help-email">${t('help.email')}</label>
        <input id="help-email" name="email" type="email" maxlength="80" autocomplete="email" placeholder="name@example.com"
          value="${esc(p.email || '')}" aria-describedby="help-email-error">

      </div>
      <div class="field">
        <label for="help-topic">${t('help.topic')}</label>

          ${HELP_TOPICS.map((id) => `<option value="${id}">${t(`help.topic.${id}`)}</option>`).join('')}
        </select>

      <div class="field">
        <label for="help-message">${t('help.message')}</label>

          aria-describedby="help-message-error"></textarea>
        <span class="field-error" id="help-message-error"></span>
      </div>
      <!-- Ловушка для ботов: человек это поле не видит, а бот заполняет -->
      <div class="help-trap" aria-hidden="true">
        <label for="help-botcheck">Не заполняйте это поле</label>
        <input id="help-botcheck" name="botcheck" type="text" tabindex="-1" autocomplete="off">
      </div>
      <p class="form-error" id="help-error" role="alert"></p>
      <button type="submit" class="btn btn-primary btn-block" id="help-send">${t('help.send')}</button>
    </form>`;
  openModal();
  helpOpenedAt = Date.now();
  (p.name && p.email ? $('#help-message') : $('#help-name')).focus();

  const form = $('#help-form');
  form.addEventListener('input', (e) => {
    const err = $(`#help-${e.target.name}-error`);
    if (err) err.textContent = '';
    e.target.removeAttribute('aria-invalid');
  });
  form.addEventListener('submit', onHelpSubmit);
}

async function onHelpSubmit(e) {
  e.preventDefault();
  const form = e.target;
  const data = Object.fromEntries(new FormData(form));
  const val = (k) => (data[k] || '').trim();
  const errorEl = $('#help-error');
  errorEl.textContent = '';

  // 1. Пустые и неверно заполненные поля — подсказка прямо под полем
  const links = (val('message').match(/https?:\/\/|www\./gi) || []).length;
  const fieldErrors = {
    name: val('name').length < 2 ? 'help.err.name' : '',
    email: EMAIL_RE.test(val('email')) ? '' : 'help.err.email',
    message: val('message').length < 10 ? 'help.err.message' : links > HELP_MAX_LINKS ? 'help.err.links' : '',
  };
  for (const [name, key] of Object.entries(fieldErrors)) {
    $(`#help-${name}-error`).textContent = key ? t(key) : '';
    if (key) form.elements[name].setAttribute('aria-invalid', 'true');
    else form.elements[name].removeAttribute('aria-invalid');
  }
  const firstInvalid = Object.keys(fieldErrors).find((name) => fieldErrors[name]);
  if (firstInvalid) return form.elements[firstInvalid].focus();
  if (!HELP_TOPICS.includes(data.topic)) return;

  // 2. Защита от спама
  if (val('botcheck')) return showHelpSuccess(val('email')); // боту делаем вид, что всё отправлено
  if (Date.now() - helpOpenedAt < HELP_MIN_FILL_MS) {
    errorEl.textContent = t('help.err.tooFast');
    return;
  }
  const wait = Math.ceil((Number(store.get(KEYS.helpLast, 0)) + HELP_COOLDOWN_SEC * 1000 - Date.now()) / 1000);
  if (wait > 0) {
    errorEl.textContent = t('help.err.cooldown', { sec: wait });
    return;
  }
  if (!WEB3FORMS_ACCESS_KEY || WEB3FORMS_ACCESS_KEY === HELP_KEY_PLACEHOLDER) {
    errorEl.textContent = t('help.err.noKey');
    return;
  }

  // 3. Отправка
  const button = $('#help-send');
  button.disabled = true;
  button.textContent = t('help.sending');
  try {
    const topic = t(`help.topic.${data.topic}`);
    const res = await fetch('https://api.web3forms.com/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
      body: JSON.stringify({
        access_key: WEB3FORMS_ACCESS_KEY,
        subject: `PMRAuto: ${topic}`,
        from_name: 'PMRAuto',
        name: val('name'),
        email: val('email'),
        topic,
        message: val('message'),
        language: lang,
      }),
    });
    let result = {};
    try { result = await res.json(); } catch { /* сервер ответил не JSON */ }
    if (!res.ok || !result.success) {
      throw Object.assign(new Error(result.message || `HTTP ${res.status}`), { fromServer: true, status: res.status });
    }
    try { store.set(KEYS.helpLast, Date.now()); } catch { /* без хранилища просто нет паузы */ }
    showHelpSuccess(val('email'));
  } catch (err) {
    errorEl.textContent = !err.fromServer
      ? t('help.err.network')
      : err.status === 429 ? t('help.err.rateLimit') : t('help.err.server', { details: err.message });
  } finally {
    if (button.isConnected) {
      button.disabled = false;
      button.textContent = t('help.send');
    }
  }
}

function showHelpSuccess(email) {
  $('#modal-body').innerHTML = `
    <div class="help-success">
      <div class="help-success-icon" aria-hidden="true">✓</div>
      <h2 id="modal-title">${t('help.successTitle')}</h2>
      <p class="modal-text">${t('help.successText', { email: esc(email) })}</p>
      <button type="button" class="btn btn-primary btn-block" data-close>${t('help.close')}</button>
    </div>`;
  $('#modal-body [data-close]').focus();
}

// Кнопки «Задать вопрос» внутри страниц (например, в «Контактах»)
document.addEventListener('click', (e) => {

/* ---------- Роутер ----------
   У каждой страницы свой адрес после решётки — так ссылку можно отправить, страница
   переживает обновление, а GitHub Pages не нужно ничего настраивать:
     #/                         главная
     #/search?brand=BMW&...     результаты поиска (только фильтры, отличные от обычных)
     #/car/<id>                 объявление
     #/sell, #/sell/<id>        новое объявление / редактирование
     #/account/<вкладка>        личный кабинет: profile, messages, listings, security
     #/account/messages/<id>    открытый чат
     #/page/<id>, #/favorites, #/compare
   Адрес — главный источник правды: по нему восстанавливается страница при загрузке
   и при «Назад»/«Вперёд». Пути к картинкам (img/...) от решётки не зависят. */

let currentRoute = { name: 'home', param: null };

const enc = encodeURIComponent;

function routeToHash({ name, param }) {
  switch (name) {
    case 'search': {
      const query = new URLSearchParams();
      for (const [k, v] of Object.entries(param || {})) {
        if (k in DEFAULT_FILTERS && v !== DEFAULT_FILTERS[k]) query.set(k, v);
      }
      const qs = query.toString();
      return `#/search${qs ? `?${qs}` : ''}`;
    }
    case 'car': return `#/car/${enc(param || '')}`;
    case 'sell': return param ? `#/sell/${enc(param)}` : '#/sell';
    case 'account': {
      const [tab, chatId] = String(param || 'profile').split(':');
      return `#/account/${enc(tab)}${chatId ? `/${enc(chatId)}` : ''}`;
    }
    case 'my': return '#/account/listings';
    case 'page': return `#/page/${enc(param || '')}`;
    case 'favorites': return '#/favorites';
    case 'compare': return '#/compare';
    default: return '#/';
  }
}

function hashToRoute(hash) {
  // Ссылки из писем Supabase (#access_token=…, #error=…) — не наши адреса: открываем главную
  if (!hash.startsWith('#/')) return { name: 'home', param: null };
  const [pathPart, qs = ''] = hash.slice(2).split('?');
  const [name, ...rest] = pathPart.split('/').filter(Boolean).map((s) => {
    try { return decodeURIComponent(s); } catch { return s; }
  });
  switch (name) {
    case 'search': {
      const param = { ...DEFAULT_FILTERS };
      for (const [k, v] of new URLSearchParams(qs)) if (k in DEFAULT_FILTERS) param[k] = v;
      if (param.vehicle && !VEHICLES.includes(param.vehicle)) param.vehicle = '';
      if (!SORTERS[param.sort]) param.sort = DEFAULT_FILTERS.sort;
      return { name, param };
    }
    case 'car':
    case 'page':
      return { name, param: rest[0] || '' };
    case 'sell':
      return { name, param: rest[0] || null };
    case 'account':
      return { name, param: rest[1] ? `${rest[0]}:${rest[1]}` : rest[0] || 'profile' };
    case 'favorites':
    case 'compare':
      return { name, param: null };
    default:
      return { name: 'home', param: null };
  }
}

// Записывает маршрут в адрес и историю браузера
function setHistory(route, replace = false) {
  try {
    history[replace ? 'replaceState' : 'pushState'](route, '', routeToHash(route));
  } catch { /* history недоступна — просто рисуем */ }
}

function go(name, param = null, { replace = false } = {}) {
  if (name === 'catalog') { // «Каталог» и «Смотреть все» — все объявления без фильтров
    resetFilters({ vehicle: '' });
    name = 'search';
  }
  if (name === 'search') param = { ...filters };
  if (name === 'my') { // старый адрес «Мои объявления» — теперь вкладка кабинета
    name = 'account';
    param = 'listings';
  }
  currentRoute = { name, param };
  setHistory(currentRoute, replace);
  router();
}

// «Назад»/«Вперёд» и ручное изменение адреса: страницу берём из адреса
window.addEventListener('popstate', () => {
  const raw = location.hash;
  currentRoute = hashToRoute(raw);
  if (!booted) return; // данные ещё грузятся — boot() сам нарисует нужную страницу
  if (!$('#modal').hidden) closeModal();
  // Не наш адрес (например, служебная ссылка Supabase в уже открытой вкладке) — приводим в порядок
  if (raw && !raw.startsWith('#/')) setHistory(currentRoute, true);
  router();
  if (/error_code=/.test(raw)) toast(t('auth.linkExpired'), 'error');
});

// Настоящий адрес ссылки — чтобы работали «Открыть в новой вкладке» и «Копировать ссылку»
function linkHash(link) {
  const name = link.dataset.go;
  const param = link.dataset.param || null;
  if (name === 'catalog') return routeToHash({ name: 'search', param: { ...DEFAULT_FILTERS, vehicle: '' } });
  if (name === 'search') return routeToHash({ name, param: { ...filters } });
  return routeToHash({ name, param });
}

// Ссылки рисуются с href="#", а адрес подставляется, когда на них наводят мышь, фокус или палец
['mouseover', 'focusin', 'touchstart'].forEach((type) => document.addEventListener(type, (e) => {
  const link = e.target.closest?.('a[data-go]');
  if (link) link.setAttribute('href', linkHash(link));
}, { passive: true }));

document.addEventListener('click', (e) => {
  const link = e.target.closest('[data-go]');
  if (!link) return;
  // Ctrl/Cmd/Shift+клик — новая вкладка или окно: пусть браузер откроет ссылку сам
  if (link.tagName === 'A' && (e.ctrlKey || e.metaKey || e.shiftKey || e.button !== 0)) {
    link.setAttribute('href', linkHash(link));
    return;
  }
  e.preventDefault();
  go(link.dataset.go, link.dataset.param || null);
});

function router({ keepScroll = false } = {}) {
  const { name: route, param } = currentRoute;
  const scrollY = window.scrollY;
  galleryStep = null;
  // В разделе «Сообщения» на телефоне прячем плавающую кнопку, чтобы она не закрывала поле ввода
  document.body.classList.toggle('in-messages', route === 'account' && String(param || '').startsWith('messages'));
  app.classList.toggle('container-wide', !['car', 'sell', 'my', 'account', 'page', 'search', 'favorites', 'compare'].includes(route));

  switch (route) {
    case 'car':
      renderNav('car');
      viewDetail(param || '');
      break;
    case 'sell':
      renderNav('sell');
      viewSell(param);
      break;
    case 'account':
      renderNav(String(param || '').startsWith('messages') ? 'messages' : 'account');
      viewAccount(param || 'profile');
      break;
    case 'my': // старый адрес «Мои объявления» — теперь вкладка кабинета
      renderNav('account');
      viewAccount('listings');
      break;
    case 'page':
      renderNav('page');
      viewPage(param || '');
      break;
    case 'favorites':
      renderNav('favorites');
      viewFavorites();
      break;
    case 'compare':
      renderNav('compare');
      viewCompare();
      break;
    case 'search':
      if (param) resetFilters(param);
      renderNav('search');
      viewSearch();
      break;
    default:
      renderNav('home');
      viewHome();
  }
  renderFooter(); // подсвечиваем открытую страницу в футере
  window.scrollTo(0, keepScroll ? scrollY : 0);
  if (booted) refreshInBackground();
}

// Страницы, которые можно тихо перерисовать, когда с сервера пришли новые объявления
const LIVE_ROUTES = ['home', 'search', 'car', 'favorites', 'compare'];

function refreshInBackground() {
  const route = currentRoute;
  refreshData().then((changed) => {
    if (!changed || currentRoute !== route || !LIVE_ROUTES.includes(route.name)) return;
    // Не мешаем, пока человек что-то вводит или в открытом окне
    if (document.activeElement?.matches('input, textarea, select') || !$('#modal').hidden) return;
    router({ keepScroll: true });
  });
}

// Синхронизация между вкладками: язык, избранное и сравнение.
// Вход и выход Supabase передаёт между вкладками сам (см. onAuthChange)
window.addEventListener('storage', (e) => {
  if (e.key === KEYS.lang && LANGS[e.newValue]) return setLang(e.newValue);
  if ([KEYS.favorites, KEYS.compare].includes(e.key)) {
    if (['favorites', 'compare'].includes(currentRoute.name)) router({ keepScroll: true });
    else updateSavedUI();
  }
});

// Когда вкладка снова на экране — подтягиваем свежие объявления и счётчик сообщений
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && booted) {
    refreshInBackground();
    refreshUnread();
  }
});

let booted = false;

async function boot() {
  try { OLD_KEYS.forEach((k) => localStorage.removeItem(k)); } catch { /* хранилище недоступно */ }
  buildExamples();
  // Открываем ту страницу, что в адресе (после обновления или по присланной ссылке)
  currentRoute = hashToRoute(location.hash);
  applyStaticText();
  app.innerHTML = `<div class="empty"><p>${t('app.loading')}</p></div>`;

  let session = null;
  if (sb) {
    try {
      session = (await sb.auth.getSession()).data.session;
    } catch { /* без сессии — как гость */ }
  }
  await loadData();
  await loadSession(session);
  booted = true;
  // Пока грузились данные, адрес могли поменять («Назад» или ссылки из писем Supabase,
  // которые Supabase сам убирает из адреса) — берём его заново
  currentRoute = hashToRoute(location.hash);
  // Записываем адрес в каноническом виде; служебная часть ссылок из писем при этом исчезает
  setHistory(currentRoute, true);
  router();
  subscribeMessages();
  if (db.failed) toast(t('err.load'), 'error');

  if (RECOVERY_LINK && db.me) openNewPassword();
  else if (AUTH_LINK_ERROR) toast(t('auth.linkExpired'), 'error');
}

boot();
</script>
